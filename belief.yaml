# Declarations for the component-belief MCP, applied to itself.
#
# This file is the approval gate. The server reads it from git HEAD, not the
# working tree — editing it changes nothing until a human commits. Uncommitted
# edits show up in `status` as PENDING and score no evidence.
#
# Every contract below is a `kind: gate`: the pytest suites are deterministic
# procedures, so a suite passes or fails at a revision. The belief is read from
# the latest run, not from a rate that reruns of the same result cannot move.
#
# Every component claims its code. The claim is what lets the artifacts view
# say which files are owned, the coverage view (consistency-belief) tell a
# planned component from an unclaimed one, and the belief view mark evidence
# stale once a claimed file changes after the revision it measured. Files that
# only the tool surface exercises (server, views, render) are claimed by the
# component whose end-to-end contract measures that surface.

components:
  - id: CMP-declarations
    purpose: Load and validate belief.yaml from git HEAD
    outputs: [IFC-declarations__model]
    testable_capability: >-
      Rejects unmeasurable contracts and non-node components, and refuses to
      let uncommitted edits take effect
    failure_modes:
      - {id: FM-worktree-leak, observable: "an uncommitted threshold change alters a verdict",
         observed_by: CTR-declarations-gate, case: "tests.test_declarations::test_working_tree_edits_do_not_take_effect"}
      - {id: FM-accepts-unmeasurable, observable: "a contract with no test accepts evidence",
         observed_by: CTR-declarations-gate, case: "tests.test_declarations::test_not_evaluable_contract_accepts_no_evidence"}
      - {id: FM-goal-measured-by-agent, observable: "a goal whose measure or its test lives in belief.yaml loads with no issue",
         observed_by: CTR-declarations-gate, case: "tests.test_declarations.TestGoals::test_a_goal_measured_by_what_the_agent_writes_is_reported"}
    remediation: Tighten validate() and _validate_goals(); the fatal-code set in Declarations.is_scorable
    goal: GOL-honest-evidence
    code:
      - src/component_belief/declarations.py
      - src/component_belief/expr.py

  - id: CMP-consistency-declarations
    purpose: Load consistency.yaml from git HEAD, validate it, and join it to this file's components
    outputs: [IFC-cdeclarations__proofdag]
    testable_capability: >-
      Reports an unknown premise, a cycle among declarations, a subject this
      file no longer declares and a reference to a source consistency.yaml does
      not declare, and refuses to let uncommitted edits take effect
    failure_modes:
      - {id: FM-cycle-admitted, observable: "two declarations citing each other load with no CIRCULAR_DEPENDENCY issue",
         observed_by: CTR-consistency-declarations-gate, case: "tests.test_consistency_declarations::test_validation_detects_circular_declarations"}
      - {id: FM-removed-subject-silent, observable: "a branch whose component left belief.yaml reads as governing it",
         observed_by: CTR-consistency-declarations-gate, case: "tests.test_consistency_coverage::test_a_removed_component_leaves_its_design_broken"}
      - {id: FM-worktree-leak, observable: "an uncommitted axiom edit alters a proof state",
         observed_by: CTR-consistency-declarations-gate, case: "tests.test_consistency_declarations::test_git_head_loading_and_pending_drift"}
      - {id: FM-reference-weighs, observable: "adding or removing a source or a source reference changes the premise graph, a fingerprint, a proof state or a probe",
         observed_by: CTR-consistency-declarations-gate, case: "tests.test_consistency_declarations.TestSourceReferences::test_references_change_no_graph_fingerprint_proof_state_or_probe"}
      - {id: FM-dangling-reference-silent, observable: "a reference to an undeclared source, or a source nothing references, loads with no issue",
         observed_by: CTR-consistency-declarations-gate, case: "tests.test_consistency_declarations.TestSourceReferences::test_a_dangling_reference_and_an_unreferenced_source_are_reported"}
      - {id: FM-source-displaces-proposal, observable: "a staged proposal whose id only a source also bears is left out of the premise graph",
         observed_by: CTR-consistency-declarations-gate, case: "tests.test_consistency_declarations.TestSourceReferences::test_a_source_sharing_a_staged_proposals_id_leaves_it_admitted"}
    remediation: validate() and validate_links() in the consistency declarations loader
    goal: GOL-sound-designs
    code:
      - src/consistency_belief/declarations.py

  - id: CMP-proof-dag
    purpose: Hold the proof DAG and compute each node's verification state
    inputs: [IFC-cdeclarations__proofdag]
    outputs: [IFC-proofdag__views]
    testable_capability: >-
      Admits a node only on declared or staged premises and without a cycle, in
      dependency order rather than file order, moves a node to REFUTED only on a
      falsified probe, and counts independent trials by strategy and actor
    failure_modes:
      - {id: FM-file-order, observable: "a branch declared above its premise is dropped from the graph",
         observed_by: CTR-proof-dag-invariants, case: "tests.test_consistency_graph::test_declarations_join_in_dependency_order_not_file_order"}
      - {id: FM-gap-refutes, observable: "an entailment gap is reported as a counterexample",
         observed_by: CTR-proof-dag-invariants, case: "tests.test_consistency_probes::test_a_gap_doubts_and_never_refutes"}
      - {id: FM-stale-carried, observable: "a trial keeps counting after its target or a premise is restated",
         observed_by: CTR-proof-dag-invariants, case: "tests.test_consistency_probes::test_a_trial_recorded_against_another_statement_is_not_carried"}
      - {id: FM-repeat-counts, observable: "three probes of one strategy by one actor close an obligation",
         observed_by: CTR-proof-dag-invariants, case: "tests.test_consistency_probes::test_model_state_transitions"}
    remediation: ProofDAG.from_declarations' dependency-ordered join; model.compute_consistency's fingerprints and independence count
    goal: GOL-sound-designs
    code:
      - src/consistency_belief/graph.py
      - src/consistency_belief/model.py
      - src/consistency_belief/probes.py

  - id: CMP-trial-ledger
    purpose: Append-only store of proposals, trials, amendments, decisions and withdrawals, and the tool surface over it
    inputs: [IFC-proofdag__views]
    testable_capability: >-
      Replays the same state from the events alone, keeping a withdrawn proposal
      and its trials on record, refusing a falsification argued from the source,
      and naming the revision every decision was taken at
    failure_modes:
      - {id: FM-mutating-history, observable: "an amendment edits the record it corrects",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server::test_amend_reclassifies_without_editing"}
      - {id: FM-withdrawn-erased, observable: "a withdrawn proposal leaves no trace",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server::test_a_withdrawn_proposal_and_its_trials_stay_on_record"}
      - {id: FM-declared-masked, observable: "a stale staged copy stands in for a declaration",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server::test_trials_carry_over_when_the_same_statement_is_declared"}
      - {id: FM-source-falsification, observable: "a counterexample naming a source file is recorded as a refutation",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server::test_verify_step_refuses_a_falsification_argued_from_source"}
      - {id: FM-restated-claim-keeps-measurement, observable: "a branch restated, or one whose premise was, reads its cited contract as reviewed",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server.TestCitedMeasurements::test_restating_the_claim_or_a_premise_leaves_it_unreviewed_until_read_again"}
      - {id: FM-pin-restates, observable: "writing a pin on a cited measurement sets a trial aside",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server.TestCitedMeasurements::test_a_pin_reads_reviewed_and_restates_nothing"}
      - {id: FM-goal-measures-mixed, observable: "a goal's measure is listed among the component contracts no design cites",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server::test_goal_and_interface_measures_are_listed_apart_from_a_components"}
      - {id: FM-uncited-contract-silent, observable: "a contract no branch cites goes unreported",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server.TestCitedMeasurements::test_an_unpinned_measurement_and_an_uncited_contract_are_shown"}
      - {id: FM-references-unlisted, observable: "status lists a source without the nodes that reference it, or an axiom without its references",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server::test_sources_are_listed_with_the_nodes_that_reference_them"}
      - {id: FM-tree-unreadable, observable: "the tree for one node draws nodes outside its lineage",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server::test_the_tree_of_one_node_draws_only_its_lineage"}
      - {id: FM-ignored-parameter-silent, observable: "a status view given a parameter it does not read says nothing of it",
         observed_by: CTR-trial-ledger-replay, case: "tests.test_consistency_server::test_a_parameter_a_view_ignores_is_named"}
    remediation: Store.staged_proposals / withdrawn; every write goes through append_event; the source-citation refusal in verify_step
    goal: GOL-sound-designs
    code:
      - src/consistency_belief/store.py
      - src/consistency_belief/decide.py
      - src/consistency_belief/server.py
      - src/consistency_belief/views.py
      - src/consistency_belief/render.py
      - src/consistency_belief/ids.py
      - src/consistency_belief/__init__.py
      - src/consistency_belief/measurements.py

  - id: CMP-belief-model
    purpose: Compute belief slices from evidence, priors, and declarations
    inputs: [IFC-declarations__model]
    outputs: [IFC-model__diagnose]
    testable_capability: >-
      Produces a conditioned posterior per (contract, bucket, compat_group)
      that no asserted evidence can influence, reads a gate contract from its
      latest run, and sets evidence aside once the code it measured has changed
    failure_modes:
      - {id: FM-pollution, observable: "an annotation changes a posterior",
         observed_by: CTR-model-honest, case: "tests.test_beliefs::test_asserted_evidence_can_never_move_a_posterior"}
      - {id: FM-silent-pooling, observable: "incompatible trials land in one slice",
         observed_by: CTR-model-honest, case: "tests.test_beliefs::test_incompatible_evidence_is_never_pooled"}
      - {id: FM-premature-verdict, observable: "a verdict is issued below n_min",
         observed_by: CTR-model-honest, case: "tests.test_beliefs::test_insufficient_evidence_is_a_state_not_a_low_number"}
      - {id: FM-stale-counted, observable: "a trial measured before a claimed file changed still counts as current",
         observed_by: CTR-model-honest, case: "tests.test_gate_and_staleness.TestStaleness::test_evidence_measured_before_a_claimed_file_changed_is_stale"}
      - {id: FM-judged-per-trial, observable: "a view re-judges every trial of a run, its time growing with trials times tracked files",
         observed_by: CTR-model-honest, case: "tests.test_gate_and_staleness.TestJudgedOncePerRun::test_the_trials_of_one_run_are_judged_once_and_alike"}
      - {id: FM-blind-outside-git, observable: "a trial resting on a declared input git ignores stays current after that file changes, or is never current",
         observed_by: CTR-model-honest, case: "tests.test_gate_and_staleness.TestInputsOutsideGit::test_the_same_bytes_again_are_current"}
    remediation: model.eligible() and the slice key in compute_slices(); staleness.CodeStaleness
    goal: GOL-honest-evidence
    code:
      - src/component_belief/model.py
      - src/component_belief/stats.py
      - src/component_belief/staleness.py

  - id: CMP-diagnosis
    purpose: Rank bottlenecks by decision relevance, and evaluate the declared policy
    inputs: [IFC-model__diagnose]
    testable_capability: >-
      Returns coverage_limited instead of an optimisation recommendation when
      no test targets the leading candidate, and refuses to adopt on an
      insufficient or stale slice
    failure_modes:
      - {id: FM-optimise-the-unseen, observable: "an optimisation is recommended for an uninstrumented component",
         observed_by: CTR-diagnosis-refuses-blind-optimisation, case: "tests.test_diagnose_decide::test_unobserved_component_with_no_test_limits_coverage"}
      - {id: FM-e2e-attribution, observable: "a component is blamed with no local observation",
         observed_by: CTR-diagnosis-refuses-blind-optimisation, case: "tests.test_diagnose_decide::test_upstream_of_a_failure_is_suspected_not_ignored"}
      - {id: FM-adopt-on-stale, observable: "a policy adopts on a slice whose evidence predates a code change",
         observed_by: CTR-diagnosis-refuses-blind-optimisation, case: "tests.test_diagnose_decide::test_a_stale_slice_cannot_satisfy_an_adopt_criterion"}
    remediation: diagnose() status assignment and the coverage_limited branch; decide.evaluate_policy
    goal: GOL-honest-evidence
    code:
      - src/component_belief/diagnose.py
      - src/component_belief/planning.py
      - src/component_belief/decide.py

  - id: CMP-runner
    purpose: Execute declared tests, capture artifacts, and serve the tool surface
    testable_capability: >-
      Records measured evidence with an artifact, its hash and the revision it
      ran at, never transcribed; and no tool on the surface writes a belief
    failure_modes:
      - {id: FM-fabricated-metric, observable: "a declared metric is synthesised from an exit code",
         observed_by: CTR-surface-intact, case: "tests.test_server.TestRunner::test_exit_code_fallback_does_not_fabricate_a_declared_metric"}
      - {id: FM-unversioned-run, observable: "a measured record carries no sw_revision",
         observed_by: CTR-surface-intact, case: "tests.test_server.TestRunner::test_every_measured_record_names_the_revision_it_ran_at"}
      - {id: FM-unbacked-import, observable: "an imported record is recorded without an artifact the server copied and hashed, or against a test its contract does not list",
         observed_by: CTR-surface-intact, case: "tests.test_server.TestToolSurface::test_ingest_accepts_a_complete_record"}
      - {id: FM-run-id-collision, observable: "two runs at once share a run id, or hand one evidence id to two records",
         observed_by: CTR-surface-intact, case: "tests.test_server.TestParallelRuns::test_two_runs_at_once_take_distinct_ids_and_both_land"}
      - {id: FM-runs-serialised, observable: "run_test calls made together run one after another",
         observed_by: CTR-surface-intact, case: "tests.test_server.TestParallelRuns::test_the_tool_runs_calls_made_together_at_once"}
    remediation: runner.run_test() synthesis branch; the tool list in server.py; the checks in server.ingest()
    goal: GOL-honest-evidence
    code:
      - src/component_belief/runner.py
      - src/component_belief/readlog.py
      - src/component_belief/store.py
      - src/component_belief/server.py
      - src/component_belief/views.py
      - src/component_belief/render.py
      - src/component_belief/stamps.py
      - src/component_belief/ids.py
      - src/component_belief/__init__.py
      - tools/pytest_trials.py

  - id: CMP-stamp-monitor
    purpose: Report across both ledgers what a change touches, whether the evidence is intact, and how the loop was followed
    testable_capability: >-
      Traces a changed path to the contracts, design branches and policies it
      touches; reports a damaged ledger line, a changed artifact or stamp, and an
      agent approving its own adoption; and writes nothing while doing so
    failure_modes:
      - {id: FM-monitor-writes, observable: "a monitor tool changes a ledger file",
         observed_by: CTR-monitor-read-only, case: "tests.test_stamp_monitor::test_the_tools_read_and_never_write"}
      - {id: FM-missed-impact, observable: "a changed claimed path is not traced to its contract",
         observed_by: CTR-monitor-read-only, case: "tests.test_stamp_monitor.TestImpact::test_a_claimed_change_is_traced_through_both_ledgers"}
      - {id: FM-silent-tamper, observable: "an edited artifact or stamp audits clean",
         observed_by: CTR-monitor-read-only, case: "tests.test_stamp_monitor.TestAudit::test_an_edited_artifact_is_caught"}
    remediation: stamp_monitor.impact / audit / workflow; the tool list in stamp_monitor/server.py
    goal: GOL-honest-evidence
    code:
      - src/stamp_monitor/

  - id: CMP-goals
    purpose: Keep goals.yaml -- the goals, the interfaces between them and how each is measured -- the human's
    testable_capability: >-
      Refuses an agent-trailered commit that changes goals.yaml or a file its tests name, and
      passes the human's; records any agent commit to the goal set since the human's last; and
      withdraws the goals policy's standing approval while one exists
    failure_modes:
      - {id: FM-goal-set-leak, observable: "an agent commit changing a goal's test file is let through the guard",
         observed_by: CTR-goal-set-stays-human, case: "tests.test_goals.TestCheck::test_an_agent_commit_to_the_goal_set_is_refused"}
      - {id: FM-freed-by-removal, observable: "removing a test from goals.yaml frees its file in the same commit",
         observed_by: CTR-goal-set-stays-human, case: "tests.test_goals.TestCheck::test_dropping_a_test_from_goals_yaml_does_not_free_its_file"}
      - {id: FM-stale-ratification, observable: "an adoption under the goals policy records without an approver after the agent changed the goal set",
         observed_by: CTR-goal-set-stays-human, case: "tests.test_goals.TestRatification::test_an_agent_change_to_the_goal_set_withdraws_that"}
      - {id: FM-human-blocked, observable: "a commit the human types is refused",
         observed_by: CTR-goal-set-stays-human, case: "tests.test_goals.TestCheck::test_the_same_commit_by_the_human_passes"}
    remediation: goals.goal_set, check_commit, goal_history and ratification_gap
    goal: GOL-goals-stay-mine
    code:
      - src/component_belief/goals.py

  - id: CMP-plugin
    purpose: Ship the four servers, the two workflow skills and the verifier as one Claude Code plugin any project can enable, at a pinned version
    testable_capability: >-
      Every server installs from the release tag of the plugin's own version and reads the
      project Claude Code reports; the verifier holds only consistency-belief tools its server
      registers; every server resolves the same project root
    failure_modes:
      - {id: FM-wrong-root, observable: "a server enabled in one project reads another project's ledger, or an empty one",
         observed_by: CTR-plugin-pinned-and-rooted, case: "tests.test_plugin.TestProjectRoot::test_every_server_resolves_the_same_project"}
      - {id: FM-version-drift, observable: "the plugin, the marketplace entry, the package and the pinned tag name different versions",
         observed_by: CTR-plugin-pinned-and-rooted, case: "tests.test_plugin.TestManifest::test_every_server_installs_from_this_versions_tag"}
      - {id: FM-toolless-verifier, observable: "the verifier names a tool its server does not register",
         observed_by: CTR-plugin-pinned-and-rooted, case: "tests.test_plugin.TestManifest::test_the_verifier_holds_only_tools_its_server_registers"}
    remediation: component_belief.project.project_root; plugin/.mcp.json; plugin/agents/consistency-verifier.md
    goal: GOL-any-project
    code:
      - plugin/
      - .claude-plugin/marketplace.json
      - src/component_belief/project.py

  - id: CMP-graph-snapshot
    purpose: Draw the design graph at one revision -- each component, the theory it rests on, every claim's proof tree and the gaps between them -- as one page a person can read
    testable_capability: >-
      Shows the declarations committed at the one revision it names, the proof state the
      consistency server computes for each lemma and branch, the issues the loaders report and
      the gaps in the joined graph; reads no evidence record; and writes nothing but its own page,
      which git does not see and no declaration names
    failure_modes:
      - {id: FM-state-invented, observable: "a lemma or branch shows a proof state the consistency server does not compute for it",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_every_proof_state_is_the_one_the_server_computes"}
      - {id: FM-revisions-mixed, observable: "a snapshot names one revision and shows a declaration committed at another",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_a_commit_during_a_snapshot_does_not_mix_revisions"}
      - {id: FM-superseded-proposal, observable: "a snapshot shows a proposal in a version the ledger no longer stages",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_a_proposal_shows_as_the_ledger_stages_it"}
      - {id: FM-worktree-shown, observable: "an uncommitted declaration edit appears in a snapshot, or goes unmentioned",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_uncommitted_edits_are_named_and_not_shown"}
      - {id: FM-gap-missed, observable: "an axiom naming no goal, or a component with code and no design, is not listed as a gap",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_the_joined_graph_lists_its_gaps"}
      - {id: FM-snapshot-writes, observable: "taking a snapshot changes a ledger file or a declaration file",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_a_snapshot_writes_only_its_page"}
      - {id: FM-reads-evidence, observable: "taking a snapshot reads the component ledger's evidence",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_a_snapshot_reads_no_evidence"}
      - {id: FM-page-tracked, observable: "git status lists the page a snapshot wrote",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_git_does_not_see_the_page"}
      - {id: FM-page-is-evidence, observable: "a snapshot writes a file a component's code claims or a declared test names",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_a_page_a_declaration_names_is_not_written"}
      - {id: FM-measurements-unshown, observable: "a snapshot omits a branch's unreviewed cited measurement or a contract no design cites",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_cited_measurements_and_uncited_contracts_are_shown"}
      - {id: FM-references-unshown, observable: "a snapshot omits a node's source references",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_source_references_are_shown_beside_their_nodes"}
      - {id: FM-template-missing, observable: "installed as a package, the server finds no page template",
         observed_by: CTR-snapshot-shows-one-revision, case: "tests.test_graph_snapshot::test_the_template_ships_with_the_package"}
    remediation: graph_snapshot.snapshot (the join, the revision it pins and the gaps); graph_snapshot.page; the one tool in graph_snapshot/server.py
    goal: GOL-sound-designs
    code:
      - src/graph_snapshot/

  - id: CMP-code-links
    purpose: Read tagged code regions at one revision and say whether each link still matches its code and its claim
    testable_capability: >-
      Reads markers from real comments only, at one resolved revision; reports every link whose
      body or claim pin no longer matches, at every revision until it is re-pinned, and every id
      named in a comment or docstring that resolves to nothing; and moves no proof state
    failure_modes:
      - {id: FM-unreviewed-edit-forgotten, observable: "a tagged body edited without re-pinning reads aligned a commit later",
         observed_by: CTR-code-links-aligned, case: "tests.test_code_links.TestAlignment::test_a_code_edit_stays_reported_at_every_later_commit_until_repinned"}
      - {id: FM-upstream-restatement-missed, observable: "a premise restated upstream of a linked claim leaves its pins aligned",
         observed_by: CTR-code-links-aligned, case: "tests.test_code_links.TestAlignment::test_restating_a_premise_upstream_stales_every_link_resting_on_it"}
      - {id: FM-dangling-mention-silent, observable: "a comment naming a removed claim produces no finding",
         observed_by: CTR-code-links-aligned, case: "tests.test_code_links.TestAlignment::test_a_removed_claim_leaves_its_tag_and_its_mentions_dangling"}
      - {id: FM-formatting-churn, observable: "a formatter run or a comment edit stales a body pin",
         observed_by: CTR-code-links-aligned, case: "tests.test_code_links.TestAlignment::test_a_formatter_run_or_a_comment_edit_keeps_the_pin"}
      - {id: FM-code-in-probe, observable: "the probe a verifier reads names a region or a source path",
         observed_by: CTR-code-links-aligned, case: "tests.test_code_links.TestBoundaries::test_the_probe_carries_no_code"}
      - {id: FM-worktree-indexed, observable: "an uncommitted edit changes what the committed index reports",
         observed_by: CTR-code-links-aligned, case: "tests.test_code_links.TestRevisions::test_working_tree_edits_are_reported_and_never_indexed"}
      - {id: FM-aligned-read-as-working, observable: "a link reads aligned with nothing beside it saying the evidence its claim cites is stale or missing",
         observed_by: CTR-code-links-aligned, case: "tests.test_code_links.TestMeasurementBesideLinks::test_each_link_shows_the_state_of_the_evidence_its_claim_cites"}
      - {id: FM-environment-unscoped-silent, observable: "a test behind linked code names no lockfile and nothing says so",
         observed_by: CTR-code-links-aligned, case: "tests.test_code_links.TestMeasurementBesideLinks::test_a_test_that_names_no_environment_file_is_reported_until_it_does"}
    remediation: code_links.parser's body digest; code_links.validation; consistency_belief.links.claim_pin
    goal: GOL-sound-designs
    code:
      - src/code_links/
      - src/consistency_belief/links.py

interfaces:
  - id: IFC-declarations__model
    producer: CMP-declarations
    consumer: CMP-belief-model
    semantics: Validated contracts, priors, and condition buckets
    producer_guarantees:
      - contracts reaching the model are scorable
      - condition predicates parse under the whitelist
    consumer_assumptions:
      - contracts reaching the model are scorable
      - condition predicates parse under the whitelist

  - id: IFC-model__diagnose
    producer: CMP-belief-model
    consumer: CMP-diagnosis
    semantics: Belief slices with state, interval, and evidence ids
    producer_guarantees:
      - every slice carries its applicable conditions
      - insufficient slices carry no verdict
      - a stale slice carries no verdict and names the change it predates
    consumer_assumptions:
      - every slice carries its applicable conditions
      - insufficient slices carry no verdict
      - a stale slice carries no verdict and names the change it predates

  - id: IFC-cdeclarations__proofdag
    producer: CMP-consistency-declarations
    consumer: CMP-proof-dag
    semantics: Validated axioms, definitions, lemmas and branches, joined to the components belief.yaml declares
    producer_guarantees:
      - every premise names a declared node, or the declaration carries UNKNOWN_PREMISE
      - a cycle among declarations is reported before the graph is built
    consumer_assumptions:
      - every premise names a declared node, or the declaration carries UNKNOWN_PREMISE
      - a cycle among declarations is reported before the graph is built

  - id: IFC-proofdag__views
    producer: CMP-proof-dag
    consumer: CMP-trial-ledger
    semantics: Verification state per node, recomputed from the ledger's trials on every read
    producer_guarantees:
      - a trial counts only under the statement fingerprint it was recorded against
      - only a falsified probe refutes
    consumer_assumptions:
      - a trial counts only under the statement fingerprint it was recorded against
      - only a falsified probe refutes

