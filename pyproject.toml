[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "component-belief-mcp"
version = "0.7.7"
description = "Component belief-update MCP: evidence-grounded belief state for a system graph"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",   # server.py targets the v1 FastMCP API; mcp 2.x renamed it to MCPServer
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
component-belief-mcp = "component_belief.server:main"
consistency-belief-mcp = "consistency_belief.server:main"
stamp-monitor-mcp = "stamp_monitor.server:main"
stamp-monitor = "stamp_monitor.cli:main"
graph-snapshot-mcp = "graph_snapshot.server:main"
graph-snapshot = "graph_snapshot.cli:main"
tdlp-guard = "component_belief.goals:guard_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graph_snapshot = ["page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
