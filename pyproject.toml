[project]
name = "plan-auto"
version = "0.1.0"
description = "A constraint-closure substrate for LLM planning, served over MCP"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.7",
]

[project.scripts]
plan-auto = "plan_auto.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plan_auto", "src/kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
