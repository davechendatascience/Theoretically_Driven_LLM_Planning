# Declarations for the consistency-belief MCP, applied to itself.
#
# Like belief.yaml, this file is the approval gate. The server reads it from
# git HEAD, not the working tree — editing it changes nothing until a human
# commits. Uncommitted edits show up in `status` as PENDING.
#
# A branch states what must hold of any implementation and cites, at the end of
# its derivation rule, the contract that measures it (`evidence: CTR-...`). It
# does not describe what a function returns: a verifier judges it from the
# premises alone, and the measurement lives in belief.yaml. The policy at the
# bottom requires both -- the branch proven here, its contract supported there.
#
# The components these designs govern. belief.yaml owns each one -- its purpose, code paths and
# contracts -- so this list is an import: it says which components the design ledger speaks for,
# and every branch's subject must be one of them.

components:
  - {id: CMP-declarations, note: belief.yaml loaded from git HEAD and validated}
  - {id: CMP-consistency-declarations, note: consistency.yaml loaded from git HEAD and joined to belief.yaml}
  - {id: CMP-proof-dag, note: the DAG kernel and the verification state over it}
  - {id: CMP-trial-ledger, note: the append-only record of proposals, trials, decisions and withdrawals}
  - {id: CMP-belief-model, note: belief slices from evidence, priors and the model version}
  - {id: CMP-diagnosis, note: bottleneck ranking and the decision policy}
  - {id: CMP-runner, note: test execution, artifact capture and the tool surface}

axioms:
  - id: AXM-axiomatic-grounding
    domain: epistemic
    statement: >-
      Every architectural claim, contract, and component must derive
      transitively from declared root axioms and definitions.
    rationale: >-
      Ungrounded claims in architectural planning introduce hidden
      assumptions and non-auditable failure modes.

  - id: AXM-falsifiable-measurement
    domain: verification
    statement: >-
      Consistency cannot be self-asserted; it must be measured via
      adversarial falsification trials with captured prompts and counterexamples.
    rationale: >-
      LLMs produce agreeable confirmations by default; rigorous consistency
      requires actively attempting to construct counterexamples.

  - id: AXM-acyclicity
    domain: logic
    statement: >-
      Deductive reasoning graphs must be strictly directed and acyclic.
    rationale: >-
      Circular arguments (A implies B implies A) provide zero inferential
      soundness and conceal contradictions.

  - id: AXM-blast-radius-invalidation
    domain: integrity
    statement: >-
      Modifying an upstream premise or axiom invalidates all downstream
      derived conclusions until re-verified.
    rationale: >-
      Foundational mutations ripple through intermediate lemmas down to
      terminal contracts; retaining old belief is unsound.

  - id: AXM-no-belief-write-path
    domain: epistemic
    statement: >-
      A measured belief -- the posterior over a contract slice -- changes only
      through evidence the server itself produced by running a declared test,
      or imported with an artifact and its hash; a statement by an agent or a
      human carries zero weight in it.
    rationale: >-
      An LLM agent is a fluent producer of plausible numbers; a belief it can
      write is a belief that measures nothing. A proof state is not a measured
      belief: it moves through recorded falsification trials judged from the
      declarations, which AXM-falsifiable-measurement governs.

  - id: AXM-commit-is-approval
    domain: integrity
    statement: >-
      A declaration takes effect only from the committed revision. Every
      verdict and every proof state is computed from committed content -- the
      declarations at the head revision and the commits that evidence names --
      and from the ledger, and from no other file in the working tree.
    rationale: >-
      The commit is the approval gate: an uncommitted edit that changed a
      verdict would let an agent approve its own threshold. The gate is exactly
      as strong as the discipline over who commits. Nothing declared here tells
      a human commit from an agent's, so that part rests on process -- review,
      CODEOWNERS, signed commits -- and not on this file.

  - id: AXM-sparse-data-no-verdict
    domain: epistemic
    statement: >-
      Below the declared sufficiency for a claim no verdict is issued; an
      estimate may be shown, labelled as insufficient.
    rationale: >-
      Declaring victory on two trials is the likeliest failure of an
      agent-driven loop; sparse data must read as "we do not know".

  - id: AXM-observe-before-optimise
    domain: diagnosis
    statement: >-
      A recommendation to optimise a component requires an observation of that
      component against its own contract; an end-to-end outcome alone
      attributes to no component.
    rationale: >-
      Optimising an uninstrumented component converts missing measurement into
      apparent progress; instrumentation is the binding constraint until then.

definitions:
  - id: DEF-proof-obligation
    term: Proof Obligation
    meaning: >-
      An open proof goal (Lean-style `sorry`) representing a derived
      claim that lacks sufficient verification trials.

  - id: DEF-counterexample
    term: Counterexample
    meaning: >-
      A concrete, realizable scenario where all premises are satisfied
      but the derived claim fails.

  - id: DEF-belief-eligible
    term: Belief-eligible evidence
    meaning: >-
      A trial record with provenance measured (the server ran the declared
      test and captured the artifact) or imported (brought in with a source,
      an artifact and its hash). A note, with provenance asserted, is not one.

  - id: DEF-premise-graph
    term: Premise graph
    meaning: >-
      The directed graph the proof kernel holds: a node for each axiom,
      definition, lemma and branch it has admitted, declared or staged, and an
      edge from each premise a node cites to that node. A node depends on
      another when a path of edges leads from the other to it. Only a citation
      is an edge: an assumption a derivation relies on without citing it is
      not in the graph, and a cycle is a cycle among these edges.

lemmas:
  - id: LMA-kernel-enforces-acyclicity
    statement: >-
      If the kernel builds the premise graph from empty, adds every edge by
      admitting a node, and admits a node only when each premise it cites is a
      different node already in the graph that does not depend on it, the
      premise graph never contains a cycle.
    premises: [DEF-premise-graph]
    derivation_rule: >-
      Induction on admissions. A build starts from the empty graph, which has
      no cycle. Suppose the graph has none when a node n is admitted citing
      premises P. Each new edge runs from some p in P to n, where p is already
      in the graph and is not n, so none is a self-loop; a new cycle would have
      to enter n by one of these edges and return from n to that p along edges
      already present -- that is, p would already depend on n, which admission
      refuses. Every edge is added this way, so no build holds a cycle. By
      DEF-premise-graph an assumption a derivation relies on without citing it
      is not an edge, so this lemma says nothing about it.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-blast-radius-propagation
    statement: >-
      If a node's fingerprint is determined by its statement and the premises
      it cites and changes whenever either does, every trial records the
      fingerprints of its target and of each node its target depends on, a
      trial counts only while its target is in the premise graph and every
      fingerprint it recorded still matches, and a node stays in the graph only
      while every premise it cites does, then restating or removing a node
      stops every earlier trial of that node and of every node that depends on
      it from counting, and leaves the trials of every other node counting as
      before.
    premises: [AXM-blast-radius-invalidation, DEF-premise-graph]
    derivation_rule: >-
      Restating a node r changes its fingerprint. Every earlier trial of r
      recorded the old one, and every earlier trial of a node d that depends on
      r recorded r's among the fingerprints of d's ancestors, so each
      mismatches and stops counting; a trial recorded afterwards carries the
      new fingerprints and counts, which is re-verification. Removing r takes
      it out of the graph, so a node citing r leaves with it, and by induction
      on the length of a path from r so does every node that depends on r; a
      trial of a node outside the graph does not count. A node e that does not
      depend on r recorded no fingerprint of r; the only fingerprint that
      changes is r's, and every node that leaves the graph is r or depends on
      r, so none of them is one e depends on -- e would then depend on r -- and
      e's trials count as before. This is the invalidation
      AXM-blast-radius-invalidation requires, and it needs neither a traversal
      order nor an acyclic graph.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-asserted-is-inert
    statement: >-
      A record with provenance asserted cannot change any belief slice.
    premises: [AXM-no-belief-write-path, DEF-belief-eligible]
    derivation_rule: >-
      By AXM-no-belief-write-path only evidence the server produced or imported
      with an artifact reaches a belief; by DEF-belief-eligible an asserted
      record is neither, so no slice is a function of it.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-worktree-inert
    statement: >-
      An edit to a declaration file that is not committed changes no verdict
      and no proof state.
    premises: [AXM-commit-is-approval]
    derivation_rule: >-
      By AXM-commit-is-approval every verdict and every proof state is computed
      from committed content and the ledger, and from no other file in the
      working tree. An uncommitted edit to a declaration file changes no
      committed content and writes nothing to the ledger, so every input of
      both is what it was, and so are they.
    sufficiency: {n_min: 3, min_consensus: 0.8}

branches:
  - id: BRN-dag-integrity
    subject: CMP-proof-dag
    claim_type: contract
    statement: >-
      The proof DAG builds its premise graph from empty on every load, adds
      every edge by admitting a node, and admits a node only when each premise
      it cites is a different node already in the graph that does not depend
      on it. So the premise graph never contains a cycle, and a node whose
      ancestry does not end in declared axioms or definitions is reported
      ungrounded, never proven.
    premises: [LMA-kernel-enforces-acyclicity, AXM-acyclicity, AXM-axiomatic-grounding, AXM-commit-is-approval, DEF-premise-graph]
    derivation_rule: >-
      By AXM-commit-is-approval a proof state is computed from committed
      content and the ledger alone, so the graph is rebuilt from them on every
      load, which is to say from empty. By DEF-premise-graph an edge runs from
      a cited premise to an admitted node, so every edge enters with an
      admission, and a node can be admitted with its edges only once each
      premise it cites is in the graph. Admitting a node that cites itself, or
      that one of its premises already depends on, would put it on a cycle,
      which AXM-acyclicity forbids; so the admission rule is necessary, and
      LMA-kernel-enforces-acyclicity makes the three together sufficient. By
      AXM-axiomatic-grounding a claim counts only through a path to declared
      axioms and definitions, so a node whose ancestry ends anywhere else is
      ungrounded and cannot be proven. evidence: CTR-proof-dag-invariants
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-falsification-trial-ledger
    subject: CMP-trial-ledger
    claim_type: contract
    statement: >-
      A recorded trial is never edited or removed. It stops counting only when
      an appended amendment reclassifies it, or when its target or a node its
      target depends on is restated or removed. While a falsified trial whose
      counterexample meets DEF-counterexample counts, its target is refuted.
    premises: [AXM-falsifiable-measurement, LMA-blast-radius-propagation, DEF-counterexample]
    derivation_rule: >-
      From AXM-falsifiable-measurement consistency is measured, never
      asserted, so a trial is a captured record: correcting it appends an
      amendment that folds over it with its reason, and the original stays.
      Setting a trial aside any other way would change the measured state with
      nothing measured and no reason recorded, which is consistency asserted;
      the one other way is LMA-blast-radius-propagation's -- its target or a
      node it depends on was restated or removed, so the trial vouches for a
      statement no longer in the graph. A counterexample meeting
      DEF-counterexample is a scenario in which every premise holds and the
      claim fails, so while it counts the claim does not follow and its target
      is refuted. evidence: CTR-trial-ledger-replay
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-declarations-gate
    subject: CMP-declarations
    claim_type: contract
    statement: >-
      Only committed declarations reach the belief model; a contract that no
      declared test can measure accepts no evidence; and an uncommitted edit
      leaves every verdict as it was.
    premises: [LMA-worktree-inert, AXM-no-belief-write-path]
    derivation_rule: >-
      From LMA-worktree-inert an uncommitted edit changes no verdict. A
      contract with no producing test has no measurement, so admitting
      evidence against it would move a belief without one, which
      AXM-no-belief-write-path forbids. evidence: CTR-declarations-gate
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-consistency-declarations-gate
    subject: CMP-consistency-declarations
    claim_type: contract
    statement: >-
      Only committed axioms, definitions, lemmas and branches enter the proof
      graph; a premise that names no declared node, and a cycle among
      declarations, are reported before any verification is recorded; and a
      branch whose subject belief.yaml no longer declares is reported as
      governing nothing rather than as proven.
    premises: [LMA-worktree-inert, AXM-acyclicity, AXM-axiomatic-grounding]
    derivation_rule: >-
      From LMA-worktree-inert only committed declarations are in effect. From
      AXM-acyclicity a cycle among declarations is unsound, so it is reported
      at load rather than verified. From AXM-axiomatic-grounding a claim about
      a component that no longer exists grounds nothing it governs, so the
      join reports it. evidence: CTR-consistency-declarations-gate
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-model-honest
    subject: CMP-belief-model
    claim_type: contract
    statement: >-
      A slice's posterior is a function of belief-eligible evidence, declared
      priors and the model version alone; below declared sufficiency the slice
      carries an estimate and no verdict; and trials that differ on a declared
      compatibility key are never pooled.
    premises: [LMA-asserted-is-inert, AXM-sparse-data-no-verdict, DEF-belief-eligible]
    derivation_rule: >-
      From LMA-asserted-is-inert and DEF-belief-eligible nothing but measured
      or imported evidence enters a posterior. From AXM-sparse-data-no-verdict
      a slice under its sufficiency reports insufficient rather than a verdict.
      Pooling across a compatibility key would average two measurement
      processes into a number neither produced, which is a belief without a
      measurement. evidence: CTR-model-honest
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-diagnosis-coverage-first
    subject: CMP-diagnosis
    claim_type: contract
    statement: >-
      When no declared test observes the leading candidate, the diagnosis
      names instrumentation as the binding constraint and recommends no
      optimisation; a component is blamed only on an observation against its
      own contract.
    premises: [AXM-observe-before-optimise]
    derivation_rule: >-
      From AXM-observe-before-optimise an optimisation recommendation needs an
      observation of its target; where no test can produce one, the only
      recommendation that satisfies the axiom is to instrument, and
      attributing an end-to-end failure to an unobserved component would be a
      blame without an observation. evidence: CTR-diagnosis-refuses-blind-optimisation
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-runner-captures
    subject: CMP-runner
    claim_type: contract
    statement: >-
      Every measured record carries the artifact the server captured and its
      hash, and a metric the artifact does not contain is excluded rather than
      synthesised.
    premises: [AXM-no-belief-write-path, DEF-belief-eligible]
    derivation_rule: >-
      From DEF-belief-eligible a measured record is one the server produced
      with its artifact, so a record without one is not measured. A metric
      absent from the artifact has no measurement behind it, and scoring it
      would move a belief on nothing, which AXM-no-belief-write-path forbids.
      evidence: CTR-surface-intact
    sufficiency: {n_min: 3, min_consensus: 0.8}

policies:
  - id: POL-consistency-gate
    criteria:
      - {target: BRN-dag-integrity, require: proven, evidence: supported}
      - {target: BRN-falsification-trial-ledger, require: proven, evidence: supported}
      - {target: BRN-declarations-gate, require: proven, evidence: supported}
      - {target: BRN-consistency-declarations-gate, require: proven, evidence: supported}
      - {target: BRN-model-honest, require: proven, evidence: supported}
      - {target: BRN-diagnosis-coverage-first, require: proven, evidence: supported}
      - {target: BRN-runner-captures, require: proven, evidence: supported}
