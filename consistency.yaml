# Declarations for the consistency-belief MCP, applied to itself.
#
# Like belief.yaml, this file is the approval gate. The server reads it from
# git HEAD, not the working tree — editing it changes nothing until a human
# commits. Uncommitted edits show up in `status` as PENDING.
#
# A branch states what must hold of any implementation and cites, at the end of
# its derivation rule, the contract that measures it (`evidence: CTR-...`). It
# does not describe what a function returns: a verifier judges it from the
# premises alone, and the measurement lives in belief.yaml. The policy at the
# bottom requires both -- the branch proven here, its contract supported there.
#
# The components these designs govern. belief.yaml owns each one -- its purpose, code paths and
# contracts -- so this list is an import: it says which components the design ledger speaks for,
# and every branch's subject must be one of them.
#
# Any declaration may reference a source -- a paper, a book, a standard -- by
# naming an entry under `sources:` in `references: [{source: SRC-x, at: "Thm 2"}]`.
# A reference is for the reader: it is no premise, no part of a fingerprint and
# never shown to a verifier (AXM-references-carry-no-weight). Nothing checks
# that the source says what the declaration states.

components:
  - {id: CMP-declarations, note: "belief.yaml loaded from git HEAD and validated"}
  - {id: CMP-consistency-declarations, note: "consistency.yaml loaded from git HEAD and joined to belief.yaml"}
  - {id: CMP-proof-dag, note: "the DAG kernel and the verification state over it"}
  - {id: CMP-trial-ledger, note: "the append-only record of proposals, trials, decisions and withdrawals"}
  - {id: CMP-belief-model, note: "belief slices from evidence, priors and the model version"}
  - {id: CMP-diagnosis, note: "bottleneck ranking and the decision policy"}
  - {id: CMP-runner, note: "test execution, artifact capture and the tool surface"}
  - {id: CMP-stamp-monitor, note: "the read-only monitor over both ledgers"}
  - {id: CMP-goals, note: "the guard and the record that keep the goal set the human's"}
  - {id: CMP-plugin, note: "the one plugin any project enables, pinned to a release"}
  - {id: CMP-code-links, note: "tagged code regions, pinned to the code and the claims they realize"}
  - {id: CMP-graph-snapshot, note: "the design graph at one revision, drawn as one page"}

axioms:
  - id: AXM-axiomatic-grounding
    domain: epistemic
    goal: GOL-sound-designs
    statement: >-
      Every architectural claim, contract, and component must derive
      transitively from declared root axioms and definitions.
    rationale: >-
      Ungrounded claims in architectural planning introduce hidden
      assumptions and non-auditable failure modes.

  - id: AXM-falsifiable-measurement
    domain: verification
    goal: GOL-sound-designs
    statement: >-
      Consistency cannot be self-asserted; it must be measured via
      adversarial falsification trials with captured prompts and counterexamples.
    rationale: >-
      LLMs produce agreeable confirmations by default; rigorous consistency
      requires actively attempting to construct counterexamples.

  - id: AXM-acyclicity
    domain: logic
    goal: GOL-sound-designs
    statement: >-
      Deductive reasoning graphs must be strictly directed and acyclic.
    rationale: >-
      Circular arguments (A implies B implies A) provide zero inferential
      soundness and conceal contradictions.

  - id: AXM-blast-radius-invalidation
    domain: integrity
    goal: GOL-sound-designs
    statement: >-
      Modifying a node invalidates every derived conclusion that rests on it
      until the steps that read the modification are verified again. A
      verification trial vouches for one step -- a claim from the statements of
      the premises it cites -- and counts only while that claim and those
      statements stand; no conclusion counts as proven while any step beneath it
      is unverified; and a step whose claim and cited statements are unchanged
      keeps every trial that recorded those statements.
    rationale: >-
      Foundational mutations ripple through intermediate lemmas down to terminal
      contracts, and retaining belief in a conclusion whose ground moved is
      unsound. But a trial judges one step, from what the premises it cites
      state: a change deeper down changes what the step rests on, not whether it
      follows. So a conclusion waits, unproven, on the steps that read what
      changed, and only those are judged again -- as a Lean theorem that uses a
      lemma proved by sorry is a valid proof from the lemma's statement, and
      still depends on sorry.

  - id: AXM-no-belief-write-path
    domain: epistemic
    goal: GOL-honest-evidence
    statement: >-
      Under the declarations in effect, a measured belief -- the posterior over
      a contract slice -- changes only through belief-eligible evidence, as
      DEF-belief-eligible defines it; a statement by an agent or a human carries
      zero weight in it.
    rationale: >-
      An LLM agent is a fluent producer of plausible numbers; a belief it can
      write is a belief that measures nothing. A proof state is not a measured
      belief: it moves through recorded falsification trials judged from the
      declarations, which AXM-falsifiable-measurement governs.

  - id: AXM-commit-is-approval
    domain: integrity
    goal: [GOL-honest-evidence, GOL-sound-designs]
    statement: >-
      A declaration takes effect only from the committed revision. Every
      verdict and every proof state the servers report is computed from
      committed content -- the declarations at the head revision, the commits
      that evidence names, and, for a trial made before trials carried
      fingerprints, the declarations committed when it was made -- and from the
      ledger, and from no other file in the working tree.
    rationale: >-
      The commit is the gate: an uncommitted edit that changed a verdict would
      let an agent move a verdict without leaving anything to review. Who may
      commit what is a separate line, drawn in goals.yaml: the agent commits
      its own engineering (belief.yaml, this file), and only the human commits
      the goals and how they are measured. Nothing declared here tells a human
      commit from an agent's; the guard keys on the agent's commit trailer, a
      convention it keeps, so that line holds against drift and rests on
      process, not on this file, against anything more.

  - id: AXM-sparse-data-no-verdict
    domain: epistemic
    goal: GOL-honest-evidence
    statement: >-
      Below the declared sufficiency for a claim no verdict is issued; an
      estimate may be shown, labelled as insufficient.
    rationale: >-
      Declaring victory on two trials is the likeliest failure of an
      agent-driven loop; sparse data must read as "we do not know".

  - id: AXM-observe-before-optimise
    domain: diagnosis
    goal: GOL-honest-evidence
    statement: >-
      A recommendation to optimise a component requires an observation of that
      component against its own contract; an end-to-end outcome alone
      attributes to no component.
    rationale: >-
      Optimising an uninstrumented component converts missing measurement into
      apparent progress; instrumentation is the binding constraint until then.

  - id: AXM-no-silent-failure
    domain: integrity
    goal: GOL-sound-designs
    statement: >-
      A declared or staged node that cannot take its place in the premise
      graph, and a declared or staged branch whose subject belief.yaml no
      longer declares, are reported; neither is dropped in silence.
    rationale: >-
      A defect nobody sees reads exactly like a design that holds: a lemma
      whose premise was deleted, or a branch left behind by a removed
      component, would otherwise vanish from every view and every decision.

  - id: AXM-coverage-binds-first
    domain: diagnosis
    goal: GOL-honest-evidence
    statement: >-
      While the component a diagnosis ranks first has no observation against
      its own contract, the diagnosis recommends no optimisation of any
      component.
    rationale: >-
      The ranking is by decision relevance, so an unobserved leader means the
      ranking itself is unresolved, and optimising anything on it turns
      missing measurement into apparent progress. Design rules 7.3 and 7.5 of
      component-belief.

  - id: AXM-goal-set-is-human
    domain: integrity
    goal: GOL-goals-stay-mine
    statement: >-
      The human's commit of the goal set approves it and every policy it
      declares, and no other commit does. An agent commit that would change the
      goal set is refused; one that is made anyway is reported until the human
      next commits the goal set, and while one is reported no adoption under a
      policy goals.yaml declares stands as approved unless the human is named as
      its approver.
    rationale: >-
      GOL-goals-stay-mine in goals.yaml: my goals and how they are measured
      change only by my commit. The line is drawn against drift -- an agent
      that, stuck, relaxes a measure and sincerely reports progress -- and an
      agent commit is known by a trailer the agent keeps, so it holds against
      drift and not against an agent working around it on purpose.

  - id: AXM-pinned-and-rooted
    domain: integrity
    goal: GOL-any-project
    statement: >-
      A project that enables the plugin at a version runs the release that
      plugin's manifest names, as it was published. Every server the plugin
      starts measures that project and no other: the only declarations and
      ledger it reads are that project's, and the only tests it runs are that
      project's, in that project's environment, not in the harness's own.
    rationale: >-
      GOL-any-project in goals.yaml. A server that drifted to unreleased code,
      read the repository it was installed from, or ran a test with its own
      interpreter would report on something other than the project asking.

  - id: AXM-design-rests-on-measurement
    domain: verification
    goal: [GOL-sound-designs, GOL-honest-evidence]
    statement: >-
      Every branch is a design and every design a branch, and adopting one is a
      decision on that branch under a policy criterion; the state that criterion
      requires of the branch's evidence is the state the design's policy
      requires. A design is adopted only while the measurement it cites agrees
      with it. The measurement a design cites is each contract its derivation
      rule names, each read on its own; it agrees with the design exactly when
      every one of them reads in the required state, and contradicts it exactly
      when one reads refuted where the required state is another. A design whose
      cited measurement contradicts it is rejected, and one whose cited
      measurement does not agree, is absent or cannot be read is not adopted.
    rationale: >-
      IFC-evidence__designs in goals.yaml: a design proven over a refuted
      measurement is proven of nothing, and one proven over no measurement is
      argued, not built.

  - id: AXM-damage-blocks-while-it-counts
    domain: integrity
    goal: GOL-honest-evidence
    statement: >-
      A finding that a record's artifact or stamp can no longer be audited
      blocks while any record resting on that artifact or stamp counts. Once
      none does, the finding is still reported, with why those records were
      set aside, and does not block. No such finding is dropped.
    rationale: >-
      An audit that blocks on evidence nothing counts any more asks for a
      remedy that was already applied, and teaches a reader to stop reading it;
      one that drops the finding hides what was set aside and why.

  - id: AXM-links-never-silent
    domain: integrity
    goal: GOL-sound-designs
    statement: >-
      At every revision, every code link is reported as aligned exactly when
      it is aligned, and otherwise as not aligned, with why; and every
      mention, in a comment or docstring of a scanned file that does not
      declare its ids foreign, of an id that names no node in the declared
      graph at that revision and no code region is reported. Producing these
      reports changes no proof state and no measured belief.
    rationale: >-
      Code that realizes a claim changes constantly, and so do the claims. A
      link left behind by either reads exactly like one that still holds, and a
      comment naming a renamed claim reads like a citation. A report made only
      in the commit that broke a link is gone a commit later; one made at every
      revision is not, and one that can read aligned when the link is not is
      worse than none.

  - id: AXM-cited-measurements-reviewed
    domain: verification
    goal: [GOL-sound-designs, GOL-honest-evidence]
    statement: >-
      At every revision, every cited measurement is reported as reviewed
      exactly when it is reviewed, and otherwise as not reviewed, with why; and
      every contract declared at that revision that no branch declared at that
      revision names in its derivation rule is reported. Producing these
      reports changes no proof state, no measured belief and no recorded
      decision.
    rationale: >-
      A branch is proven of its statement and its cited contract measures
      something; nothing else holds the two together. A claim restated to say
      more keeps citing the contract that measured the old one, and the gate
      reads that contract as supported; a contract no design cites measures
      something no design says why it matters. Either reads exactly like a
      design and a measurement that agree.

  - id: AXM-references-carry-no-weight
    domain: epistemic
    goal: GOL-sound-designs
    statement: >-
      A source reference records where a declaration came from and carries no
      weight in a proof: no node's place in the premise graph, no node's
      fingerprint, no trial's standing, no proof state and no probe served to a
      verifier depends on whether a declaration references a source, or which,
      or on which sources are declared or what they record. At every revision, every source reference naming no source
      declared at that revision is reported, and so is every source declared
      at that revision that no node declared there references.
    rationale: >-
      An agent can write a plausible reference as easily as a plausible
      number, and a paper named beside a claim reads as support for it -- to a
      person, and to a verifier shown it, who may defer to the name instead of
      judging the step. A reference is worth keeping for what it is, a record a
      person can follow back to where a root came from; it must never become a
      way to make a claim count. A reference to nothing, or a source nothing
      uses, is a citation that has come apart from what it cites.

definitions:
  - id: DEF-proof-obligation
    term: Proof Obligation
    meaning: >-
      An open proof goal (Lean-style `sorry`) representing a derived
      claim that lacks sufficient verification trials.

  - id: DEF-counterexample
    term: Counterexample
    meaning: >-
      A concrete, realizable scenario where all premises are satisfied
      but the derived claim fails.

  - id: DEF-belief-eligible
    term: Belief-eligible evidence
    meaning: >-
      A trial record with provenance measured -- the server ran a declared test,
      captured its artifact with the artifact's hash, and took the record's
      metrics from that artifact, or, where the run wrote none and its test
      declares the metric passed, took passed alone from the exit code the
      server captured -- or imported -- brought in with its source, an artifact
      and the artifact's hash -- and in either case recorded against a contract
      that a declared test can measure. Every record carries exactly one
      provenance: measured, imported or asserted. A record that is neither
      measured nor imported, a note among them, is asserted.

  - id: DEF-premise-graph
    term: Premise graph
    meaning: >-
      The directed graph the proof kernel builds afresh on every read, from the
      axioms, definitions, lemmas and branches declared at the head revision and
      the proposals staged in the ledger. A node is identified by its id, and an
      id has at most one staged proposal: the one most recently proposed for it
      and not withdrawn since. For an id declared at the head revision the
      declaration is its only candidate for admission, whether or not it can be
      admitted; for any other id with a staged proposal, that proposal is its
      only candidate. A node's statement and the premises it cites are its
      candidate's. A build starts from the empty graph and admits nodes one at a
      time, each at most once, and never removes one. A node is admitted only
      once every premise it cites is already in the graph, and a build ends only
      when every candidate left out cites a premise that is not in it. Admitting
      a node adds it together with an edge from each premise it cites to it; no
      other step adds a node or an edge. A node depends on another when a path
      of edges leads from the other to it. Only a citation is an edge: an
      assumption a derivation relies on without citing it is not in the graph,
      and a cycle is a cycle among these edges.

  - id: DEF-current-trial
    term: Current trial
    meaning: >-
      A trial is current exactly when three things hold: its validity, after any
      amendments appended to it, is valid; its target is in the premise graph;
      and what it recorded still holds of its target. A trial records its
      target's fingerprint and, for each premise its target cites, that
      premise's statement -- the statements the probe it was judged from served.
      What it recorded holds exactly when its target's fingerprint is the
      recorded one and each premise its target cites has the statement recorded
      for it. A trial that recorded fingerprints in place of premise statements
      holds exactly when its target's fingerprint and that of each premise its
      target cites are the ones it recorded; a trial made before trials carried
      fingerprints counts as having recorded those its target and its target's
      cited premises had in the build when it was made. A node's fingerprint is
      determined by its statement and the premises it cites, and differs
      whenever either differs. Only current trials are counted, toward
      sufficiency, consensus and refutation alike.

  - id: DEF-ledger
    term: Ledger
    meaning: >-
      The append-only records the two servers keep: trials, amendments, notes,
      events and decisions, and the artifacts runs capture. A declaration file
      is not part of it.

  - id: DEF-observation
    term: Observation
    meaning: >-
      An observation of a component against its own contract is a
      belief-eligible trial recorded against a contract whose subject is that
      component. A component is confirmed failing only on failing
      observations against its own contract.

  - id: DEF-proof-state
    term: Proof state
    meaning: >-
      Only a node in the premise graph has a proof state; a node no build admits
      has none and is never proven. A node's proof state is computed from its
      place in the premise graph and, for it and for each node it depends on,
      the version the build admitted -- its declaration at the head revision,
      or, for an id not declared there, its staged proposal -- with that
      version's statement, cited premises and declared sufficiency, and the
      trials recorded on it, taken as a set whatever order they were recorded
      in; and from nothing else belief.yaml or the ledger says about it, its
      subject included. A lemma or branch's step is verified exactly when it
      cites at least one premise and every node it depends on that cites none is
      a declared axiom or definition; its current trials cover at least its
      declared minimum of distinct strategy and actor pairs, a minimum below one
      being read as one; the share of its current trials that passed meets its
      declared consensus; and none of its current trials is falsified. A lemma
      or branch is proven exactly when its step is verified and so is the step
      of every lemma and branch it depends on; it is conditional exactly when
      its step is verified and the step of some lemma or branch it depends on is
      not.

  - id: DEF-contract-slice
    term: Contract slice
    meaning: >-
      The belief-eligible trials on one contract that fall in the same
      declared condition bucket and carry the same value for every key in the
      contract's declared compatibility key. Each slice is a claim of its own:
      the verdict a slice issues is on that slice, its sufficiency is counted
      over that slice's trials alone, and the posterior over it is computed
      from that slice's trials and its contract's declared prior alone, with
      nothing from another slice entering it.

  - id: DEF-restatement
    term: Restatement
    meaning: >-
      A node's statement and the premises it cites are those of its candidate,
      as DEF-premise-graph defines it. A node is restated when its statement or
      the premises it cites change while its id stays declared at the head
      revision or staged in the ledger -- whether its candidate's own content
      changes, or its candidate becomes another record with different content,
      as when a declaration appears or disappears beside a staged proposal with
      the same id. It is removed when its id is neither declared at the head
      revision nor staged in the ledger.

  - id: DEF-goal-set
    term: Goal set
    meaning: >-
      goals.yaml, and every file git tracks that a test declared in goals.yaml
      names on its run line or in reads:. A commit changes the goal set when
      it changes such a file, a test counting as declared when goals.yaml
      declares it either before or after the commit.

  - id: DEF-agent-commit
    term: Agent commit
    meaning: >-
      A commit whose message carries the agent's trailer, Co-Authored-By:
      Claude. Every other commit is the human's.

  - id: DEF-release
    term: Release
    meaning: >-
      The release a plugin's manifest names is the code at the git tag
      tdlp--v<version>, where <version> is the version that manifest names --
      the one its marketplace entry and the package name too. A project runs
      that release as it was published exactly when every server the plugin
      starts installs from that tag.

  - id: DEF-contract-state
    term: Contract state
    meaning: >-
      The state a contract reads in, where a design cites it: the weakest state
      among its slices, refuted weakest, then stale, contested, insufficient and
      supported; and no evidence when it has no slice. A policy criterion
      requires one of the five slice states, never no evidence.

  - id: DEF-evidence-record
    term: Evidence record
    meaning: >-
      A trial record in the evidence ledger is recorded against exactly one
      contract, and enters the slices of that contract and of no other.

  - id: DEF-measured-record
    term: Measured record
    meaning: >-
      A trial record with provenance measured carries a reference to the
      artifact the server captured from the run and that artifact's hash. Its
      metrics are those the run wrote into that artifact; when the run wrote
      none and its test declares the metric passed, its only metric is passed,
      read from the exit code the server captured. A record is scored against
      its contract's rule from the metrics it carries alone: one that lacks a
      metric the rule reads is excluded, and no value is supplied for it.

  - id: DEF-set-aside
    term: Set-aside record
    meaning: >-
      A trial record is set aside exactly when its validity, after the
      amendments appended to it, is anything other than valid -- quarantined,
      invalid or superseded. A set-aside record moves no measured belief. A
      trial record counts exactly when it is not set aside.

  - id: DEF-audit
    term: Audit
    meaning: >-
      The audit re-checks every artifact and every stamp that a measured or
      imported record rests on, whether or not that record counts, and makes a
      finding for each it can no longer audit. An artifact or stamp can no
      longer be audited exactly when the artifact is missing or no longer
      matches the hash recorded for it, or the stamp is missing or no longer
      matches the digest a trial resting on it recorded.

  - id: DEF-report
    term: Report
    meaning: >-
      Output a reader returns to its caller, computed from the ledger, the
      declarations and the repository. Producing a report appends no record to
      the ledger -- no trial, amendment, note, event or decision, of any
      provenance -- changes no declaration, makes no commit and does not move
      the head revision. Output that does any of these is not a report.

  - id: DEF-snapshot
    term: Snapshot
    meaning: >-
      What taking a snapshot of a project returns and writes. Taking one
      resolves the project's head revision to one commit before it reads any
      declaration, names that commit and no other revision, and takes every
      declaration it shows from that commit and from no other version of it; a
      declaration file whose working copy differs from that commit it names as
      carrying uncommitted edits, which it does not show. It builds the premise
      graph as DEF-premise-graph defines it, from that commit's declarations
      and the proposals staged in the ledger as the snapshot read it, and every
      proposal it shows is the one staged for that id in the ledger as the
      snapshot read it. For each lemma and branch in that build it shows the
      proof state DEF-proof-state gives that node in that build, and no other.
      Beside them it lists the issues the declaration loaders and the build
      report, and the gaps the joined graph shows: an axiom naming no goal, a
      goal no axiom names, a component with code that no declared branch
      governs, an interface or goal no branch governs, an axiom or definition
      nothing rests on, a cited measurement that is not reviewed at that commit
      as DEF-cited-measurement defines it, and a contract declared at that
      commit that no branch declared there names in its derivation rule,
      marked as a goal's, an interface's or a component's. Beside each branch
      it shows whether each of its cited measurements is reviewed at that
      commit. Beside each axiom, definition, lemma and
      branch it shows the code regions linked to that node in the scanned files
      of that commit, each with its link's state as DEF-aligned-link gives it at
      that commit, and it lists the tags and mentions the code-link scan of that
      commit reports as broken and the links it reports as not aligned; a code
      region is never a node or an edge of the premise graph it shows. It shows
      no state for a contract and reads no evidence record. Taking a snapshot
      appends no record to the ledger --
      no trial, amendment, note, event or decision, of any provenance --
      changes no declaration, makes no commit and does not move the head
      revision. Besides the report it returns, it writes two files and nothing
      else: its page, and a file that keeps git from tracking the directory
      both are in. That directory holds no declaration file and no part of the
      ledger, and where a component's code claims either file, or a declared
      test names either on its run line or among what it reads, the snapshot
      writes nothing.

  - id: DEF-code-link
    term: Code link
    meaning: >-
      A scanned file at a revision is a Python source file git tracks at that
      revision outside the ledger directories. A code link is a relation of kind
      implements, uses or checks, declared in comments of a scanned file at a
      revision, from a delimited region of that file to a node, carrying two
      pins: a body pin on the region and a claim pin on the relation. A relation
      of kind motivated-by asserts no correspondence and is not a code link. A
      region's body digest is determined by its code with comments and layout
      set aside, and differs whenever that code differs. The declared graph at a
      revision is the premise graph DEF-premise-graph describes, built from the
      declarations committed at that revision with no staged proposal. A node's
      claim digest at a revision is determined by the fingerprints, as
      DEF-current-trial uses them, of the node and of every node it depends on
      in the declared graph at that revision, and differs whenever any of those
      differs or the set of nodes it depends on differs. A link's body pin is
      taken by recording the body digest of the link's own region, and its claim
      pin by recording the claim digest of the link's own node, each as it
      stands at the revision the pin is taken at, so a pin equals that digest as
      it stood then. A file that declares tdlp:foreign-ids names ids of the
      projects it builds; its mentions are not mentions of this project's nodes.
      A code link is a declared relationship: it is not a trial and not a record
      in the ledger.

  - id: DEF-aligned-link
    term: Aligned link
    meaning: >-
      A code link is aligned at a revision exactly when its region is well
      formed and its id is carried by no other region there, its node is in
      the declared graph at that revision, its body pin equals the region's
      body digest at that revision, and its claim pin equals the node's claim
      digest at that revision.

  - id: DEF-cited-measurement
    term: Cited measurement
    meaning: >-
      A cited measurement at a revision is a pair of a branch declared at that
      revision and a contract id that branch's derivation rule names, once or
      more. It carries a pin when a pin is written directly after a mention of
      that id in that rule -- the first such pin, if more than one -- taken by
      recording the branch's claim digest, as DEF-code-link defines it, when
      the contract's acceptance rule and the tests that measure it were read
      against the branch's claim; so a pin equals that digest for the claim as
      it stood then. A branch that is not in the declared graph at a revision
      has no claim digest there. A cited measurement is reviewed at a revision
      exactly when it carries a pin, its branch is in the declared graph at
      that revision, and its branch's claim digest there equals the pin. A
      derivation rule is neither a node's statement nor the premises it cites,
      so writing, changing or removing a pin changes neither.

  - id: DEF-source-reference
    term: Source reference
    meaning: >-
      A source is an entry under sources: in consistency.yaml at a revision,
      with an id and a title and optionally authors, a year, identifiers and a
      note; it is declared at that revision. A source reference is an entry in
      the references: of an axiom, definition, lemma or branch declared at a
      revision, naming a source by its id and optionally a place in it.
      Whatever its id, a source is not an axiom, definition, lemma, branch or
      staged proposal: it is no candidate for admission to the premise graph,
      and never the declaration an id's candidacy is taken from. For admission
      and for the version a proof state is computed from, an id is declared at
      the head revision exactly when an axiom, definition, lemma or branch with
      that id is declared there; an id that only a source bears keeps its
      staged proposal, if it has one, as its only candidate. Neither a
      source nor a source reference is a node, a premise or an edge of the
      premise graph; neither is part of any node's statement, derivation rule,
      cited premises or declared sufficiency; neither is a trial or a record in
      the ledger; and neither, nor anything a source records, is among what a
      proof state is computed from. The probe served for a node is computed
      from the premise graph, the derivation rules of the nodes in it, the
      trials recorded on them and the proof states computed for them, and from
      nothing else. A source reference is
      dangling at a revision exactly when no source with the id it names is
      declared at that revision. Nothing checks that a source says what a node
      that references it states.

lemmas:
  - id: LMA-kernel-enforces-acyclicity
    statement: >-
      No build of the premise graph contains a cycle.
    premises: [DEF-premise-graph]
    derivation_rule: >-
      Induction on the admissions of one build, which DEF-premise-graph makes
      one at a time from the empty graph, each node at most once, with nothing
      removed. The empty graph has no cycle. When a node n is admitted it is
      new to the build, so no edge leaves it yet: an edge leaving n is added
      only when a node citing n is admitted, and such a node is admitted only
      once n is already in the graph, so after n. Every edge added with n ends
      at n, so a new cycle would have to leave n along an edge, and none does.
      So every admission keeps the graph acyclic. An assumption a derivation
      relies on without citing it is not an edge, so this lemma says nothing
      about it.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-blast-radius-propagation
    statement: >-
      Consider a change that restates or removes one node r, as DEF-restatement
      defines them, and nothing else: no other id is restated or removed, no id
      that had no candidate gains one, and no trial is recorded and no amendment
      appended. When r is restated, a trial of r that recorded a fingerprint
      other than r's new one is not current, and so is a trial of a node citing
      r that recorded for r a statement, or a fingerprint, other than r's new
      one. When r is removed, no trial of r or of a node that depends on r is
      current. When r is in the graph both before and after the change, a trial
      of a node other than r is current after it exactly when it was before,
      unless that node cites r and either r's statement differs between the two
      builds or the trial recorded fingerprints in place of statements; so a
      trial of a node that depends on r without citing it keeps its standing,
      and so does a trial of a node citing r that recorded statements, while r's
      statement is unchanged. Either way, a trial of a node other than r that
      depends on r in neither build is current after the change exactly when it
      was before.
    premises: [AXM-blast-radius-invalidation, DEF-premise-graph, DEF-current-trial, DEF-restatement]
    derivation_rule: >-
      The change records no trial and appends no amendment, so every trial there
      was is still there with the validity after amendments it had: of the three
      conditions DEF-current-trial sets, only the second and third can change.
      By DEF-restatement a restatement changes r's statement or cited premises,
      so by DEF-current-trial r's fingerprint now differs from its old one. A
      trial of r holds only if the fingerprint it recorded is r's now, so one
      that recorded any other is not current; a trial of a node citing r holds
      only if what it recorded for r -- its statement, or for a trial that
      recorded fingerprints, its fingerprint -- is r's now, so one that recorded
      another is not current. A removed node's id is neither declared nor
      staged, so by DEF-premise-graph no build admits it, and since a node is
      admitted only once every premise it cites is in the graph, induction along
      a path from r shows that no node depending on r is admitted; a trial whose
      target is not in the graph is not current. Now let r be in the graph
      before and after the change, and take a node e other than r. Every node
      other than r keeps a candidate with the same statement and cited premises,
      and r is admitted in both builds. By DEF-premise-graph a build admits a
      node once every premise it cites is in the graph, and ends only when every
      candidate left out cites a premise that is not in it, so whatever the
      order of admission a candidate is in a build exactly when every premise it
      cites is; by induction along the paths to e, e is admitted in one build
      exactly when in the other. If it is, its fingerprint is the same in both,
      and so are the statement and fingerprint of each premise it cites other
      than r; so by DEF-current-trial each of its trials holds after the change
      exactly when before, unless e cites r and what the trial recorded for r is
      r's in one build and not the other -- which, for a recorded statement,
      needs r's statement to differ between the builds, and for a recorded
      fingerprint follows from r's fingerprint differing. If e is in neither
      build, none of its trials is current in either. A node other than r that
      depends on r in neither build has nothing it depends on restated or
      removed, so it is admitted in one build exactly when in the other, with
      the same fingerprint and cited premises, and its trials keep their
      standing. By DEF-current-trial a trial made before trials carried
      fingerprints counts as having recorded those of the build it was made in,
      so all of this holds of it too. This is the invalidation
      AXM-blast-radius-invalidation requires: it falls on the steps that read
      what changed, and on no other.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-asserted-is-inert
    statement: >-
      Under the declarations in effect, a record with provenance asserted cannot
      change any measured belief.
    premises: [AXM-no-belief-write-path, DEF-belief-eligible]
    derivation_rule: >-
      By DEF-belief-eligible every record carries exactly one provenance, and a
      record whose provenance is asserted is neither measured nor imported, so
      it is not belief-eligible evidence. By AXM-no-belief-write-path, under the
      declarations in effect, a measured belief changes only through
      belief-eligible evidence. So under those declarations no measured belief
      changes through a record whose provenance is asserted.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-worktree-inert
    statement: >-
      Making an edit to a declaration file, and nothing else -- no commit, and
      no record appended to the ledger -- changes no verdict and no proof state
      the servers report.
    premises: [AXM-commit-is-approval, DEF-ledger]
    derivation_rule: >-
      By AXM-commit-is-approval every verdict and every proof state the servers
      report is computed from committed content -- the declarations at the head
      revision, the commits that evidence names, and the declarations committed
      when a trial made before fingerprints was made -- and from the ledger, and
      from no other file in the working tree. Making the edit adds no commit and
      moves no revision, so it changes none of that committed content; it
      appends no record, and by DEF-ledger a declaration file is not part of the
      ledger, so the ledger is what it was. Every input of both is what it was,
      so making the edit changes neither. A commit, or a record appended while
      the edit is in the working tree, is a further change, which this lemma
      does not cover.
    sufficiency: {n_min: 3, min_consensus: 0.8}

branches:
  - id: BRN-dag-integrity
    subject: CMP-proof-dag
    claim_type: contract
    statement: >-
      The proof kernel builds the premise graph as DEF-premise-graph defines,
      so the graph never contains a cycle, as AXM-acyclicity requires, and a
      lemma or branch whose ancestry does not end in declared axioms or
      definitions is ungrounded and never proven.
    premises: [LMA-kernel-enforces-acyclicity, AXM-acyclicity, AXM-axiomatic-grounding, DEF-premise-graph, DEF-proof-state]
    derivation_rule: >-
      DEF-premise-graph defines the premise graph as the build the proof kernel
      makes on every read. By LMA-kernel-enforces-acyclicity no such build
      contains a cycle, which is what AXM-acyclicity requires of a deductive
      graph. By DEF-proof-state a node no build admits is never proven, and a
      lemma or branch in the graph is proven only when it cites a premise and
      every node it depends on that cites none is a declared axiom or
      definition; so a lemma or branch whose ancestry ends anywhere else is
      never proven, which is the ungrounded case AXM-axiomatic-grounding
      forbids.
      evidence: CTR-proof-dag-invariants
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-falsification-trial-ledger
    subject: CMP-trial-ledger
    claim_type: contract
    statement: >-
      A recorded trial is never edited or removed. It stops being current only
      when an appended amendment reclassifies it, or when its target, or a node
      its target depends on in the build before or after the change, is
      restated or removed. A counterexample that meets DEF-counterexample
      against the target's present statement and premises shows that the
      target's claim does not follow from them.
    premises: [AXM-falsifiable-measurement, LMA-blast-radius-propagation, DEF-counterexample, DEF-current-trial, DEF-ledger, DEF-premise-graph, DEF-restatement]
    derivation_rule: >-
      By DEF-ledger a trial is an entry in an append-only record, so it is never
      edited or removed, and by AXM-falsifiable-measurement it is a captured
      measurement, so a correction is an amendment appended beside it with its
      reason. By DEF-current-trial whether a trial is current turns on nothing
      but its validity after amendments, its target's place in the graph, its
      target's fingerprint, and the statement, or for a trial that recorded
      fingerprints the fingerprint, of each premise its target cites; validity
      changes only by an appended amendment, and a fingerprint or a statement
      only when a statement or the premises cited change, which DEF-restatement
      calls restating. By DEF-premise-graph the graph is built from the declared
      and staged nodes and their citations alone, so it changes only when a node
      is declared, restated or removed. Declaring an id with no staged proposal
      makes no trial stop being current, since a node in the graph cites only
      nodes already in it; declaring an id that is staged, or deleting a
      declaration beside a staged proposal with the same id, changes that node's
      candidate, which by DEF-restatement restates it when the two differ in
      statement or cited premises and changes nothing a trial depends on when
      they do not; and by LMA-blast-radius-propagation a change that restates or
      removes one node r makes a trial stop being current only when its target
      is r or depends on r in the build before or after the change. A change
      that alters several candidates at once is judged trial by trial: by
      DEF-current-trial a trial stops being current only if an amendment is
      appended to it, its target leaves the graph, its target's fingerprint
      differs from the recorded one, or a premise its target cites has a
      statement, or fingerprint, other than the one recorded for it; each of
      these, amendments aside, needs some node its target depends on in the
      build before or after the change to be restated or removed. A
      counterexample meeting DEF-counterexample against the target as it now
      stands is a scenario in which every present premise holds and the present
      claim fails, so that claim does not follow from those premises. evidence:
      CTR-trial-ledger-replay
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-declarations-gate
    subject: CMP-declarations
    claim_type: contract
    statement: >-
      Only committed declarations reach the belief model; under the declarations
      in effect, no evidence recorded against a contract that no declared test
      can measure moves a measured belief; and making an edit to a declaration
      file, and nothing else, changes no verdict the servers report.
    premises: [LMA-worktree-inert, AXM-no-belief-write-path, AXM-commit-is-approval, DEF-belief-eligible, DEF-evidence-record]
    derivation_rule: >-
      By AXM-commit-is-approval a declaration takes effect only from the
      committed revision, so only committed declarations reach the belief model.
      By DEF-evidence-record a record is recorded against exactly one contract
      and enters that contract's slices alone; by DEF-belief-eligible it is
      belief-eligible only when that contract is one a declared test can
      measure, and by AXM-no-belief-write-path, under the declarations in
      effect, a measured belief -- the posterior over a contract slice -- moves
      through nothing else. So, under the declarations in effect, a record
      against a contract no declared test can measure moves no measured belief.
      By LMA-worktree-inert making an edit to a declaration file, and nothing
      else, changes no verdict the servers report. evidence:
      CTR-declarations-gate
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-consistency-declarations-gate
    subject: CMP-consistency-declarations
    claim_type: contract
    statement: >-
      Only the declarations at the head revision and the proposals staged in the
      ledger enter the premise graph, and a staged proposal takes no effect as a
      declaration. A declared or staged node that no build admits is reported,
      never dropped in silence, and so is a declared or staged branch whose
      subject belief.yaml no longer declares; a change that removes a branch's
      subject from belief.yaml and changes nothing else leaves that branch's
      place in the premise graph, its current trials and its proof state as they
      were.
    premises: [AXM-commit-is-approval, AXM-no-silent-failure, DEF-premise-graph, DEF-current-trial, DEF-proof-state]
    derivation_rule: >-
      By DEF-premise-graph a build admits nothing but the head revision's
      declarations and the ledger's staged proposals. By AXM-commit-is-approval
      a declaration takes effect only from the committed revision, so a proposal
      that is only staged takes no effect as one. By AXM-no-silent-failure a
      declared or staged node that cannot take its place in the premise graph,
      and a declared or staged branch whose subject belief.yaml no longer
      declares, are reported rather than dropped. By DEF-proof-state a node's
      proof state is computed from its place in the graph and, for it and each
      node it depends on, the version the build admitted -- its declaration at
      the head revision, or, for an id not declared there, its staged proposal
      -- with that version's statement, cited premises and declared sufficiency,
      and the trials on it, and from nothing else belief.yaml or the ledger says
      about it, its subject included; a subject is neither a premise, by
      DEF-premise-graph, nor part of a fingerprint, by DEF-current-trial, so
      losing it changes neither the branch's place in the graph nor which of its
      trials are current, and its proof state stands. evidence:
      CTR-consistency-declarations-gate
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-model-honest
    subject: CMP-belief-model
    claim_type: contract
    statement: >-
      Under the declarations in effect, a slice's posterior changes only through
      belief-eligible evidence, and never through a record whose provenance is
      asserted; below its declared sufficiency a slice issues no verdict; and
      trials that differ on their contract's declared compatibility key are
      never pooled into one measured belief.
    premises: [AXM-no-belief-write-path, LMA-asserted-is-inert, AXM-sparse-data-no-verdict, DEF-contract-slice]
    derivation_rule: >-
      By AXM-no-belief-write-path, under the declarations in effect, a measured
      belief -- the posterior over a contract slice -- changes only through
      belief-eligible evidence, and by LMA-asserted-is-inert never through an
      asserted record. By DEF-contract-slice a slice is a claim of its own, its
      verdict is on that slice, and its sufficiency is counted over its own
      trials, so by AXM-sparse-data-no-verdict a slice below its declared
      sufficiency issues no verdict. By DEF-contract-slice trials that differ on
      a key of the contract's declared compatibility key belong to different
      slices; by AXM-no-belief-write-path a measured belief is the posterior
      over one slice, and by DEF-contract-slice that posterior is computed from
      its own slice's trials and the contract's declared prior alone, so they
      are never pooled into one measured belief. evidence: CTR-model-honest
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-diagnosis-coverage-first
    subject: CMP-diagnosis
    claim_type: contract
    statement: >-
      While the component the diagnosis ranks first has no observation against
      its own contract, the diagnosis recommends no optimisation of any
      component; and a component is confirmed failing only on failing
      observations against its own contract, never on an end-to-end outcome
      alone.
    premises: [AXM-coverage-binds-first, AXM-observe-before-optimise, DEF-observation]
    derivation_rule: >-
      The first clause is AXM-coverage-binds-first, with observation as
      DEF-observation defines it. DEF-observation confirms a component as
      failing only on failing observations against its own contract, and
      AXM-observe-before-optimise adds that an end-to-end outcome alone
      attributes to no component. evidence: CTR-diagnosis-refuses-blind-optimisation
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-runner-captures
    subject: CMP-runner
    claim_type: contract
    statement: >-
      Every measured record carries a reference to the artifact the server
      captured and that artifact's hash. Its metrics come from that artifact --
      or, for a test that declares the metric passed and whose run wrote none,
      from the exit code the server captured -- and a record that lacks a metric
      its contract's rule reads is excluded, never given a value.
    premises: [AXM-no-belief-write-path, DEF-belief-eligible, DEF-measured-record]
    derivation_rule: >-
      By DEF-measured-record a measured record carries a reference to the
      artifact the server captured and its hash, and its metrics are those the
      run wrote into that artifact, or, when it wrote none and its test declares
      passed, passed alone from the exit code the server captured; and a record
      is scored from the metrics it carries alone, so one lacking a metric its
      contract's rule reads is excluded and given no value. DEF-belief-eligible
      takes a measured record's metrics from the same two sources, and by
      AXM-no-belief-write-path, under the declarations in effect, a measured
      belief moves only through belief-eligible evidence; a value supplied for a
      metric no record carries would come from neither source. evidence:
      CTR-surface-intact
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-monitor-moves-nothing
    subject: CMP-stamp-monitor
    claim_type: contract
    statement: >-
      Producing a report changes no measured belief and no proof state: a report
      is neither belief-eligible evidence nor a trial recorded on a node, and a
      finding it states -- that evidence is stale, damaged or one-sided -- is
      not a record, so it moves no belief.
    premises: [AXM-no-belief-write-path, DEF-belief-eligible, DEF-proof-state, DEF-premise-graph, DEF-current-trial, DEF-ledger, DEF-report]
    derivation_rule: >-
      Beliefs: by DEF-report, producing a report appends no record to the ledger
      of any provenance and changes no declaration. Belief-eligible evidence, by
      DEF-belief-eligible, is a trial record, measured or imported -- a record
      in the ledger as DEF-ledger names it. Producing a report appends none, and
      a finding it states is part of its output, not a record; so by
      AXM-no-belief-write-path, under which a measured belief changes only
      through belief-eligible evidence, no measured belief moves. Proof states:
      by DEF-proof-state a node's proof state is computed from its place in the
      premise graph and, for it and each node it depends on, the version the
      build admitted -- its declaration at the head revision, or, for an id not
      declared there, its staged proposal -- and the trials recorded on it, and
      from nothing else belief.yaml or the ledger says about it; a report
      changes no declaration and, appending no record, stages or restates no
      proposal, so neither which version a build admits nor that version
      changes. By DEF-premise-graph the graph is built from the axioms,
      definitions, lemmas and branches declared at the head revision and the
      proposals staged in the ledger; a report changes no declaration and
      appends no record, so it stages no proposal and the graph is unchanged,
      whatever else it reads or writes. By DEF-current-trial whether a trial is
      current depends on its validity after amendments, its target being in the
      premise graph, and what it recorded of its target and of the premises its
      target cites; a report appends no trial and no amendment and leaves the
      graph unchanged, so the trials recorded on each node, and which of them
      are current, are unchanged. So no proof state changes. evidence:
      CTR-monitor-read-only
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-goal-guard
    subject: CMP-goals
    claim_type: contract
    statement: >-
      An agent commit that changes the goal set is refused. One made anyway is
      reported until the human next commits the goal set, and while one is
      reported, an adoption under a policy declared in goals.yaml needs a
      human named as its approver.
    premises: [AXM-goal-set-is-human, AXM-commit-is-approval, DEF-goal-set, DEF-agent-commit]
    derivation_rule: >-
      DEF-goal-set says which files make up the goal set and when a commit
      changes it, judging the tests goals.yaml declares both before and after
      the commit, so a commit cannot free a file by removing the test that
      names it; DEF-agent-commit says which commits are the agent's. By
      AXM-goal-set-is-human such a commit is refused, and one made anyway is
      reported until the human next commits the goal set. By
      AXM-commit-is-approval a policy declared in goals.yaml takes effect from
      the committed revision, and by AXM-goal-set-is-human the human's commit of
      the goal set approves it; while an agent commit to the goal set is
      reported, AXM-goal-set-is-human lets no adoption under such a policy stand
      as approved unless the human is named as its approver.
      evidence: CTR-goal-set-stays-human
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-plugin-pinned
    subject: CMP-plugin
    claim_type: contract
    statement: >-
      Every server the plugin starts installs from the tag of the version the
      plugin's manifest names and is pointed at the project that enabled it, and
      a declared test any of them runs runs in that project's environment, not
      in the harness's own.
    premises: [AXM-pinned-and-rooted, DEF-release]
    derivation_rule: >-
      By AXM-pinned-and-rooted a project that enables the plugin at a version
      runs the release that plugin's manifest names, as it was published; by
      DEF-release that release is the code at the tag of the version the
      manifest names, and it runs as published exactly when every server the
      plugin starts installs from that tag, so every one does. By
      AXM-pinned-and-rooted every server the plugin starts measures the project
      that enabled it and no other: the only declarations and ledger it reads
      are that project's, so each is pointed at that project, and the only tests
      it runs are that project's, in that project's environment and not the
      harness's own, so a declared test any of them runs runs there. evidence:
      CTR-plugin-pinned-and-rooted
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-design-gate-reads-evidence
    subject: IFC-evidence__designs
    claim_type: contract
    statement: >-
      Under a policy criterion that requires a branch's evidence in a state, the
      branch is adopted only while every contract its derivation rule names
      reads in that state. Where that state is not refuted, one such
      contract reading refuted rejects the decision; one reading in another
      state than the required one, with no evidence, or that cannot be read
      leaves the decision short of adoption.
    premises: [AXM-design-rests-on-measurement, DEF-contract-state]
    derivation_rule: >-
      By AXM-design-rests-on-measurement a branch is a design, a decision on it
      under a policy criterion is its adoption, and the state the criterion
      requires is its policy's; the measurement it cites is each contract its
      derivation rule names, each read on its own -- by DEF-contract-state, in
      the state of its weakest slice, or as no evidence when it has none. That
      measurement agrees with the design exactly when every such contract reads
      in the required state, and the design is adopted only while it agrees, so
      the branch is adopted only while each does. Where the required state is
      not refuted, one reading refuted contradicts the design, which
      AXM-design-rests-on-measurement rejects; one reading in another state,
      with no evidence, or unreadable leaves the measurement not agreeing,
      absent or unreadable, so the design is not adopted. evidence:
      CTR-design-gate-reads-evidence
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-audit-blocks-what-counts
    subject: CMP-stamp-monitor
    claim_type: contract
    statement: >-
      The audit makes a finding for every artifact or stamp a measured or
      imported record rests on that can no longer be audited. Each such finding
      blocks while a record resting on that artifact or stamp counts; once none
      does, it is still reported, with why those records were set aside, and
      does not block.
    premises: [AXM-damage-blocks-while-it-counts, DEF-set-aside, DEF-audit]
    derivation_rule: >-
      By DEF-audit the audit re-checks every artifact and every stamp a measured
      or imported record rests on, whether or not that record counts, and makes
      a finding for each it can no longer audit -- an artifact missing or no
      longer matching its recorded hash, or a stamp missing or no longer
      matching the digest a trial resting on it recorded. By
      AXM-damage-blocks-while-it-counts each such finding blocks while any
      record resting on that artifact or stamp counts, and once none does it is
      still reported, with why those records were set aside, does not block, and
      is never dropped. By DEF-set-aside a trial record counts exactly when it
      is not set aside, read from its validity after the amendments appended to
      it. evidence: CTR-monitor-read-only
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-snapshot-shows-one-revision
    subject: CMP-graph-snapshot
    claim_type: contract
    statement: >-
      Every declaration a snapshot shows is as committed at the one revision
      it names, and every proposal it shows is the one staged for its id in
      the ledger as the snapshot read it. For each lemma and branch in the
      premise graph built from that revision's declarations and the proposals
      staged in the ledger as the snapshot read it, the proof state it shows
      is the one that node has in that build. Taking a snapshot changes no
      measured belief and no proof state.
    premises: [AXM-no-belief-write-path, AXM-commit-is-approval, DEF-snapshot, DEF-belief-eligible, DEF-proof-state, DEF-premise-graph, DEF-current-trial, DEF-ledger]
    derivation_rule: >-
      What it shows: by DEF-snapshot, taking a snapshot resolves the head
      revision to one commit before it reads any declaration, names that commit
      and no other revision, and takes every declaration it shows from that
      commit and from no other version of it; and every proposal it shows is the
      one staged for that id in the ledger as the snapshot read it. It builds
      the premise graph as DEF-premise-graph defines it from that commit's
      declarations and the proposals staged in the ledger as it read it, and for
      each lemma and branch in that build shows the proof state DEF-proof-state
      gives that node in that build, and no other. Beliefs: by DEF-snapshot,
      taking a snapshot appends no record to the ledger of any provenance and
      changes no declaration. Belief-eligible evidence, by DEF-belief-eligible,
      is a trial record, measured or imported -- a record in the ledger as
      DEF-ledger names it. Taking a snapshot appends none, so by
      AXM-no-belief-write-path, under which a measured belief changes only
      through belief-eligible evidence, no measured belief moves. Proof states:
      by DEF-proof-state a node's proof state is computed from its place in the
      premise graph and, for it and each node it depends on, the version the
      build admitted -- its declaration at the head revision, or, for an id not
      declared there, its staged proposal -- and the trials recorded on it, and
      from nothing else belief.yaml or the ledger says about it. By
      DEF-premise-graph the graph is built from the declarations at the head
      revision and the proposals staged in the ledger. Taking a snapshot changes
      no declaration, makes no commit, does not move the head revision and
      appends no record, so it stages, restates or withdraws no proposal, and
      neither the graph nor the version of a node it admits changes. The two
      files it writes lie in a directory that holds no declaration file and no
      part of the ledger, and by AXM-commit-is-approval every proof state is
      computed from committed content and the ledger and from no other file in
      the working tree. By DEF-current-trial whether a trial is current depends
      on its validity after amendments, its target being in the premise graph,
      and what it recorded of its target and of the premises its target cites;
      taking a snapshot appends no trial and no amendment and leaves the graph
      unchanged, so the trials recorded on each node, and which of them are
      current, are unchanged. So no proof state changes. evidence:
      CTR-snapshot-shows-one-revision
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-links-stale-when-either-side-moves
    subject: CMP-code-links
    claim_type: contract
    statement: >-
      At every revision, a code link reads aligned exactly when it is aligned.
      A link is not aligned, and is reported with why, at every revision at
      which its region's code, comments and layout aside, differs from the code
      its body pin was taken from; or its node is not in the declared graph; or
      its node, or a node its node depends on there, has a statement or cited
      premises other than when its claim pin was taken, or its node depends on
      a different set of nodes. A mention, in a comment or docstring of a
      scanned file that does not declare its ids foreign, of an id that names
      no node in the declared graph and no code region is reported. None of
      these reports changes a proof state.
    premises: [AXM-links-never-silent, DEF-code-link, DEF-aligned-link, DEF-current-trial, DEF-premise-graph, DEF-report, DEF-proof-state]
    derivation_rule: >-
      By AXM-links-never-silent every code link is reported, at every
      revision, as aligned exactly when it is aligned and otherwise as not
      aligned with why, so it reads aligned exactly when it is aligned. By
      DEF-code-link a pin equals the digest it names for the code and the
      claim as they stood when it was taken. The body digest is determined by
      the region's code with comments and layout set aside and differs
      whenever that code differs, so where the code differs from the code the
      body pin was taken from, the body digest differs from the body pin. The
      claim digest is determined by the fingerprints of the node and of every
      node it depends on in the declared graph -- which DEF-code-link builds as
      DEF-premise-graph describes -- and differs whenever one of them differs
      or the set of them does; by DEF-current-trial a fingerprint differs
      whenever a statement or the cited premises differ, so in each of those
      cases the claim digest differs from the claim pin. A node not in the
      declared graph fails DEF-aligned-link directly. In every case
      DEF-aligned-link is not met, so the link is not aligned, and by
      AXM-links-never-silent it is reported with why at every revision at
      which the case holds. The mention clause is AXM-links-never-silent's. By
      DEF-report producing a report appends no record and changes no
      declaration, and by DEF-code-link a link is neither a trial nor a ledger
      record; by DEF-proof-state a proof state is computed from the premise
      graph and the trials recorded on it alone, so no proof state changes.
      evidence: CTR-code-links-aligned
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-cited-measurements-reviewed-while-the-claim-stands
    subject: CMP-trial-ledger
    claim_type: contract
    statement: >-
      At every revision, a cited measurement reads reviewed exactly when it is
      reviewed. One that carries no pin is not reviewed; neither is one whose
      branch is not in the declared graph at that revision, nor one whose
      branch, or a node its branch depends on in the declared graph at that
      revision, has a statement or cited premises other than when its pin was
      taken, nor one whose branch depends there on a different set of nodes;
      each is reported with why at every revision at which that holds. Writing
      or changing a pin restates no node and leaves every current trial
      current. At every revision, every contract declared at that revision
      that no branch declared there names in its derivation rule is reported.
      None of these reports changes a proof state.
    premises: [AXM-cited-measurements-reviewed, DEF-cited-measurement, DEF-code-link, DEF-current-trial, DEF-premise-graph, DEF-restatement, DEF-report, DEF-proof-state]
    derivation_rule: >-
      By AXM-cited-measurements-reviewed every cited measurement is reported
      at every revision as reviewed exactly when it is reviewed, and otherwise
      as not reviewed with why, so it reads reviewed exactly when it is
      reviewed. By DEF-cited-measurement one is reviewed only when it carries
      a pin and its branch is in the declared graph with a claim digest equal
      to the pin; so one with no pin is not, and one whose branch is outside
      the declared graph, having no claim digest there, is not. A pin equals
      the claim digest of the claim as it stood when it was taken; by
      DEF-code-link the claim digest is determined by the fingerprints of the
      branch and of every node it depends on in the declared graph, and
      differs whenever one of them, or the set of them, differs; by
      DEF-current-trial a fingerprint differs whenever a statement or the
      cited premises differ. So in each remaining case, all read in the
      declared graph, the digest differs from the pin and the measurement is
      not reviewed, and AXM-cited-measurements-reviewed reports it with why at
      every revision at which the case holds. By DEF-cited-measurement a pin
      lives in a derivation rule, which is neither a statement nor cited
      premises, so by DEF-restatement changing it restates no node; by
      DEF-premise-graph a build admits nodes by the premises they cite alone,
      so every build is as it was; and by DEF-current-trial, with no amendment
      appended, every trial current before is current after. The
      uncited-contract clause is AXM-cited-measurements-reviewed's. By
      DEF-report producing a report appends no record and changes no
      declaration, and by DEF-proof-state a proof state is computed from the
      premise graph and the trials recorded on it alone, so no proof state
      changes. evidence: CTR-trial-ledger-replay
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-references-carry-no-weight
    subject: CMP-consistency-declarations
    claim_type: contract
    statement: >-
      Two revisions whose declarations are alike except in their sources and
      source references, each read as the head revision, build over the same
      ledger the same premise graph, give every node in it the same
      fingerprint and the same current trials,
      give every lemma and branch the same proof state, and serve the same
      probe for every node. At every revision, every dangling source reference
      is reported, and so is every source declared at that revision that no
      node declared there references.
    premises: [AXM-references-carry-no-weight, DEF-source-reference, DEF-premise-graph, DEF-current-trial, DEF-proof-state]
    derivation_rule: >-
      Read each revision as the head revision, as DEF-premise-graph builds from.
      By DEF-source-reference a source, whatever its id, is no candidate for
      admission and never the declaration an id's candidacy is taken from, and
      neither a source nor a source reference is a node, a premise or an edge,
      nor part of any node's statement, derivation rule, cited premises or
      declared sufficiency, nor a trial or a ledger record. So the two revisions
      declare the same axioms, definitions, lemmas and branches, each with the
      same statement, derivation rule, cited premises and sufficiency, over the
      same ledger. An id is declared, for admission, exactly when one of those
      bears it, so the same ids are declared in both; and an id only a source
      bears keeps its staged proposal, so every id has the same candidate,
      staged or declared. By DEF-premise-graph a build's candidates, which of
      them it admits and the edges it adds are determined by those ids,
      statements and cited premises and by the staged proposals, so both builds
      are the same graph. By DEF-current-trial a fingerprint is determined by a
      node's statement and cited premises, so every fingerprint is the same;
      whether a trial is current is determined by its validity after amendments,
      its target being in the graph, and its target's fingerprint and the
      statements of the premises its target cites, all the same, so the same
      trials are current. By DEF-proof-state a proof state is computed from the
      node's place in the graph and, for it and each node it depends on, the
      admitted version's statement, cited premises and declared sufficiency, and
      the trials on it, all the same, and by DEF-source-reference no source,
      nothing a source records and no source reference is among what it is
      computed from, so every proof state is the same. By DEF-source-reference
      the probe for a node is computed from the graph, the derivation rules, the
      trials and the proof states alone, all the same, so it is the same. The
      reporting clause is AXM-references-carry-no-weight's, with dangling as
      DEF-source-reference defines it. evidence:
      CTR-consistency-declarations-gate
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-proven-rests-on-proven
    subject: CMP-proof-dag
    claim_type: contract
    statement: >-
      A lemma or branch is proven only while its own step and the step of every
      lemma and branch it depends on are verified: one whose own step is
      verified while a step beneath it is not is conditional, and never proven,
      whatever order the trials were recorded in. A trial of a node citing a
      premise counts only while that premise has the statement the trial
      recorded for it, so trials recorded against a premise's old statement do
      not count once the premise is restated to another, even when the restated
      premise is proven. When one node is restated and stays in the graph, and
      nothing else changes, every trial of a node that depends on it without
      citing it keeps its standing, and so does every trial that recorded
      statements, of a node citing it, while the restated node's statement is
      unchanged.
    premises: [AXM-blast-radius-invalidation, DEF-proof-state, DEF-current-trial, LMA-blast-radius-propagation]
    derivation_rule: >-
      By DEF-proof-state a lemma or branch is proven exactly when its step is
      verified and so is the step of every lemma and branch it depends on, and
      conditional exactly when its step is verified and the step of some lemma
      or branch it depends on is not; so one whose own step is verified over a
      step that is not is conditional and not proven, and since a proof state is
      computed from the trials taken as a set, the order they were recorded in
      decides nothing. That is what AXM-blast-radius-invalidation requires: no
      conclusion counts as proven while any step beneath it is unverified. By
      DEF-current-trial a trial holds only while each premise its target cites
      has the statement the trial recorded for it, or, for a trial that recorded
      fingerprints, the fingerprint, which by the same definition differs
      whenever the statement does; so a trial recorded against a premise's old
      statement is not current while the premise has another, whatever that
      premise's own proof state. The last sentence is
      LMA-blast-radius-propagation's, for a change that restates one node that
      is in the graph before and after it. evidence: CTR-proof-dag-invariants
    sufficiency: {n_min: 3, min_consensus: 0.8}

