# Declarations for the consistency-belief MCP, applied to itself.
#
# Like belief.yaml, this file is the approval gate. The server reads it from
# git HEAD, not the working tree — editing it changes nothing until a human
# commits. Uncommitted edits show up in `status` as PENDING.
#
# A branch states what must hold of any implementation and cites, at the end of
# its derivation rule, the contract that measures it (`evidence: CTR-...`). It
# does not describe what a function returns: a verifier judges it from the
# premises alone, and the measurement lives in belief.yaml. The policy at the
# bottom requires both -- the branch proven here, its contract supported there.
#
# The components these designs govern. belief.yaml owns each one -- its purpose, code paths and
# contracts -- so this list is an import: it says which components the design ledger speaks for,
# and every branch's subject must be one of them.

components:
  - {id: CMP-declarations, note: belief.yaml loaded from git HEAD and validated}
  - {id: CMP-consistency-declarations, note: consistency.yaml loaded from git HEAD and joined to belief.yaml}
  - {id: CMP-proof-dag, note: the DAG kernel and the verification state over it}
  - {id: CMP-trial-ledger, note: the append-only record of proposals, trials, decisions and withdrawals}
  - {id: CMP-belief-model, note: belief slices from evidence, priors and the model version}
  - {id: CMP-diagnosis, note: bottleneck ranking and the decision policy}
  - {id: CMP-runner, note: test execution, artifact capture and the tool surface}
  - {id: CMP-stamp-monitor, note: the read-only monitor over both ledgers}

axioms:
  - id: AXM-axiomatic-grounding
    domain: epistemic
    statement: >-
      Every architectural claim, contract, and component must derive
      transitively from declared root axioms and definitions.
    rationale: >-
      Ungrounded claims in architectural planning introduce hidden
      assumptions and non-auditable failure modes.

  - id: AXM-falsifiable-measurement
    domain: verification
    statement: >-
      Consistency cannot be self-asserted; it must be measured via
      adversarial falsification trials with captured prompts and counterexamples.
    rationale: >-
      LLMs produce agreeable confirmations by default; rigorous consistency
      requires actively attempting to construct counterexamples.

  - id: AXM-acyclicity
    domain: logic
    statement: >-
      Deductive reasoning graphs must be strictly directed and acyclic.
    rationale: >-
      Circular arguments (A implies B implies A) provide zero inferential
      soundness and conceal contradictions.

  - id: AXM-blast-radius-invalidation
    domain: integrity
    statement: >-
      Modifying an upstream premise or axiom invalidates all downstream
      derived conclusions until re-verified.
    rationale: >-
      Foundational mutations ripple through intermediate lemmas down to
      terminal contracts; retaining old belief is unsound.

  - id: AXM-no-belief-write-path
    domain: epistemic
    statement: >-
      A measured belief -- the posterior over a contract slice -- changes only
      through belief-eligible evidence, as DEF-belief-eligible defines it; a
      statement by an agent or a human carries zero weight in it.
    rationale: >-
      An LLM agent is a fluent producer of plausible numbers; a belief it can
      write is a belief that measures nothing. A proof state is not a measured
      belief: it moves through recorded falsification trials judged from the
      declarations, which AXM-falsifiable-measurement governs.

  - id: AXM-commit-is-approval
    domain: integrity
    statement: >-
      A declaration takes effect only from the committed revision. Every
      verdict and every proof state is computed from committed content -- the
      declarations at the head revision and the commits that evidence names --
      and from the ledger, and from no other file in the working tree.
    rationale: >-
      The commit is the approval gate: an uncommitted edit that changed a
      verdict would let an agent approve its own threshold. The gate is exactly
      as strong as the discipline over who commits. Nothing declared here tells
      a human commit from an agent's, so that part rests on process -- review,
      CODEOWNERS, signed commits -- and not on this file.

  - id: AXM-sparse-data-no-verdict
    domain: epistemic
    statement: >-
      Below the declared sufficiency for a claim no verdict is issued; an
      estimate may be shown, labelled as insufficient.
    rationale: >-
      Declaring victory on two trials is the likeliest failure of an
      agent-driven loop; sparse data must read as "we do not know".

  - id: AXM-observe-before-optimise
    domain: diagnosis
    statement: >-
      A recommendation to optimise a component requires an observation of that
      component against its own contract; an end-to-end outcome alone
      attributes to no component.
    rationale: >-
      Optimising an uninstrumented component converts missing measurement into
      apparent progress; instrumentation is the binding constraint until then.

  - id: AXM-no-silent-failure
    domain: integrity
    statement: >-
      A declared or staged node that cannot take its place in the premise
      graph, and a declared or staged branch whose subject belief.yaml no
      longer declares, are reported; neither is dropped in silence.
    rationale: >-
      A defect nobody sees reads exactly like a design that holds: a lemma
      whose premise was deleted, or a branch left behind by a removed
      component, would otherwise vanish from every view and every decision.

  - id: AXM-coverage-binds-first
    domain: diagnosis
    statement: >-
      While the component a diagnosis ranks first has no observation against
      its own contract, the diagnosis recommends no optimisation of any
      component.
    rationale: >-
      The ranking is by decision relevance, so an unobserved leader means the
      ranking itself is unresolved, and optimising anything on it turns
      missing measurement into apparent progress. Design rules 7.3 and 7.5 of
      component-belief.

definitions:
  - id: DEF-proof-obligation
    term: Proof Obligation
    meaning: >-
      An open proof goal (Lean-style `sorry`) representing a derived
      claim that lacks sufficient verification trials.

  - id: DEF-counterexample
    term: Counterexample
    meaning: >-
      A concrete, realizable scenario where all premises are satisfied
      but the derived claim fails.

  - id: DEF-belief-eligible
    term: Belief-eligible evidence
    meaning: >-
      A trial record with provenance measured -- the server ran a declared
      test, captured its artifact with the artifact's hash, and took the
      record's metrics from that artifact -- or imported -- brought in with its
      source, an artifact and the artifact's hash -- and in either case
      recorded against a contract that a declared test can measure. Every
      record carries exactly one provenance: measured, imported or asserted. A
      record that is neither measured nor imported, a note among them, is
      asserted.

  - id: DEF-premise-graph
    term: Premise graph
    meaning: >-
      The directed graph the proof kernel builds afresh on every read, from the
      axioms, definitions, lemmas and branches declared at the head revision
      and the proposals staged in the ledger. A build starts from the empty
      graph and admits nodes one at a time, each at most once, and never
      removes one. A node is admitted only once every premise it cites is
      already in the graph, and a build ends only when every node left out
      cites a premise that is not in it. Admitting a node adds it together
      with an edge from each premise it cites to it; no other step adds a node
      or an edge. A node depends on another when a path of edges leads from the
      other to it. Only a citation is an edge: an assumption a derivation
      relies on without citing it is not in the graph, and a cycle is a cycle
      among these edges.

  - id: DEF-current-trial
    term: Current trial
    meaning: >-
      A trial is current exactly when three things hold: its validity, after
      any amendments appended to it, is valid; its target is in the premise
      graph; and either it recorded no fingerprints, having been made before
      trials carried them, or the fingerprints it recorded, of its target and
      of each node its target then depended on, are exactly those its target
      and the nodes it now depends on have now. A node's fingerprint is
      determined by its statement and the premises it cites, and differs
      whenever either differs. Only current trials are counted, toward
      sufficiency, consensus and refutation alike.

  - id: DEF-ledger
    term: Ledger
    meaning: >-
      The append-only records the two servers keep: trials, amendments, notes,
      events and decisions, and the artifacts runs capture. A declaration file
      is not part of it.

  - id: DEF-observation
    term: Observation
    meaning: >-
      An observation of a component against its own contract is a
      belief-eligible trial recorded against a contract whose subject is that
      component. A component is confirmed failing only on failing
      observations against its own contract.

  - id: DEF-proof-state
    term: Proof state
    meaning: >-
      Only a node in the premise graph has a proof state; a node no build admits
      has none and is never proven. A node's proof state is computed from its
      place in the premise graph, the version of it the build admitted -- its
      declaration at the head revision, or, for an id not declared there, its
      staged proposal -- with that version's statement, cited premises and
      declared sufficiency, and the trials recorded on it, and from nothing else
      belief.yaml or the ledger says about it, its subject included. A lemma or
      branch is proven exactly when it cites at least one premise and every node
      it depends on that cites none is a declared axiom or definition; its
      current trials cover at least its declared minimum of distinct strategy
      and actor pairs, a minimum below one being read as one; the share of its
      current trials that passed meets its declared consensus; and none of its
      current trials is falsified.

  - id: DEF-contract-slice
    term: Contract slice
    meaning: >-
      The belief-eligible trials on one contract that fall in the same
      declared condition bucket and carry the same value for every key in the
      contract's declared compatibility key. Each slice is a claim of its own:
      the verdict a slice issues is on that slice, its sufficiency is counted
      over that slice's trials alone, and the posterior over it is computed
      from that slice's trials and its contract's declared prior alone, with
      nothing from another slice entering it.

  - id: DEF-restatement
    term: Restatement
    meaning: >-
      A node is restated when its statement or the premises it cites change
      while it stays declared at the head revision or staged in the ledger. It
      is removed when it is neither declared at the head revision nor staged
      in the ledger.

  - id: DEF-report
    term: Report
    meaning: >-
      Output a reader returns to its caller, computed from the ledger, the
      declarations and the repository. Producing a report appends no record to
      the ledger -- no trial, amendment, note, event or decision, of any
      provenance -- and changes no declaration. Output that does either is not a
      report.

lemmas:
  - id: LMA-kernel-enforces-acyclicity
    statement: >-
      No build of the premise graph contains a cycle.
    premises: [DEF-premise-graph]
    derivation_rule: >-
      Induction on the admissions of one build, which DEF-premise-graph makes
      one at a time from the empty graph, each node at most once, with nothing
      removed. The empty graph has no cycle. When a node n is admitted it is
      new to the build, so no edge leaves it yet: an edge leaving n is added
      only when a node citing n is admitted, and such a node is admitted only
      once n is already in the graph, so after n. Every edge added with n ends
      at n, so a new cycle would have to leave n along an edge, and none does.
      So every admission keeps the graph acyclic. An assumption a derivation
      relies on without citing it is not an edge, so this lemma says nothing
      about it.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-blast-radius-propagation
    statement: >-
      When a node r is restated, a trial of r, or of a node that depends on r,
      that recorded a fingerprint of r other than r's new one is not current.
      When r is removed, so that it is neither declared at the head revision
      nor staged in the ledger, no trial of r or of a node that depends on r is
      current. Either way, for a node other than r that depends on r neither in
      the build before the change nor in the build after it, whether each of
      its trials is current does not change.
    premises: [AXM-blast-radius-invalidation, DEF-premise-graph, DEF-current-trial]
    derivation_rule: >-
      By DEF-current-trial a trial that recorded fingerprints is current only
      if the one it recorded for r, as its target's or as that of a node its
      target depends on, is r's fingerprint now; after a restatement, one that
      recorded any other is not. A removed node is neither declared nor staged,
      so no build admits it, and since DEF-premise-graph admits a node only
      once every premise it cites is in the graph, induction along a path from
      r shows that no node depending on r is admitted either; a trial whose
      target is not in the graph is not current. Now take a node e other than r
      that depends on r in neither build. If e is in the graph in one of them,
      every node its citations lead back to is in that build and is one e
      depends on there, so r is not among them; the other build declares e and
      each of those nodes exactly as before, since only r changed, so it admits
      e with the same nodes behind it and the same fingerprints, and each of
      e's trials is current exactly as it was. If e is in neither build, none
      of its trials is current in either. For trials that recorded
      fingerprints this is the invalidation AXM-blast-radius-invalidation
      requires; a trial made before trials carried fingerprints is not
      invalidated this way, and the lemma claims nothing about it. It needs no
      traversal order and no acyclic graph.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-asserted-is-inert
    statement: >-
      A record with provenance asserted cannot change any measured belief.
    premises: [AXM-no-belief-write-path, DEF-belief-eligible]
    derivation_rule: >-
      By DEF-belief-eligible every record carries exactly one provenance, and a
      record whose provenance is asserted is neither measured nor imported, so
      it is not belief-eligible evidence. By AXM-no-belief-write-path a
      measured belief changes only through belief-eligible evidence. So no
      measured belief changes through a record whose provenance is asserted.
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: LMA-worktree-inert
    statement: >-
      Making an edit to a declaration file, without committing it, changes no
      verdict and no proof state.
    premises: [AXM-commit-is-approval, DEF-ledger]
    derivation_rule: >-
      By AXM-commit-is-approval every verdict and every proof state is computed
      from committed content -- the declarations at the head revision and the
      commits that evidence names -- and from the ledger, and from no other
      file in the working tree. Making the edit adds no commit and moves no
      revision, and by DEF-ledger a declaration file is not part of the ledger,
      so the edit adds no entry to it either. Every input of both is what it
      was, so making the edit changes neither. What happens later -- a commit,
      or evidence a run records while the edit is in the working tree -- this
      lemma does not claim.
    sufficiency: {n_min: 3, min_consensus: 0.8}

branches:
  - id: BRN-dag-integrity
    subject: CMP-proof-dag
    claim_type: contract
    statement: >-
      The proof kernel builds the premise graph as DEF-premise-graph defines,
      so the graph never contains a cycle, as AXM-acyclicity requires, and a
      lemma or branch whose ancestry does not end in declared axioms or
      definitions is ungrounded and never proven.
    premises: [LMA-kernel-enforces-acyclicity, AXM-acyclicity, AXM-axiomatic-grounding, DEF-premise-graph, DEF-proof-state]
    derivation_rule: >-
      DEF-premise-graph defines the premise graph as the build the proof kernel
      makes on every read. By LMA-kernel-enforces-acyclicity no such build
      contains a cycle, which is what AXM-acyclicity requires of a deductive
      graph. By DEF-proof-state a node no build admits is never proven, and a
      lemma or branch in the graph is proven only when it cites a premise and
      every node it depends on that cites none is a declared axiom or
      definition; so a lemma or branch whose ancestry ends anywhere else is
      never proven, which is the ungrounded case AXM-axiomatic-grounding
      forbids.
      evidence: CTR-proof-dag-invariants
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-falsification-trial-ledger
    subject: CMP-trial-ledger
    claim_type: contract
    statement: >-
      A recorded trial is never edited or removed. It stops being current only
      when an appended amendment reclassifies it, or when its target, or a node
      its target depends on in the build before or after the change, is
      restated or removed. A counterexample that meets DEF-counterexample
      against the target's present statement and premises shows that the
      target's claim does not follow from them.
    premises: [AXM-falsifiable-measurement, LMA-blast-radius-propagation, DEF-counterexample, DEF-current-trial, DEF-ledger, DEF-premise-graph, DEF-restatement]
    derivation_rule: >-
      By DEF-ledger a trial is an entry in an append-only record, so it is
      never edited or removed, and by AXM-falsifiable-measurement it is a
      captured measurement, so a correction is an amendment appended beside it
      with its reason. By DEF-current-trial whether a trial is current turns on
      nothing but its validity after amendments, its target's place in the
      graph, and the fingerprints of its target and of the nodes it depends on;
      validity changes only by an appended amendment, and a fingerprint only
      when a statement or the premises cited change, which DEF-restatement
      calls restating. By DEF-premise-graph the graph is built from the
      declared and staged nodes and their citations alone, so it changes only
      when a node is declared, restated or removed. Declaring a new node makes
      no trial stop being current, since a node in the graph cites only nodes
      already in it; and by LMA-blast-radius-propagation a restatement or
      removal of a node r makes a trial stop being current only when its
      target is r or depends on r in the build before or after the change. A
      counterexample meeting DEF-counterexample against the target as it now
      stands is a scenario in which every present premise holds and the
      present claim fails, so that claim does not follow from those premises.
      evidence: CTR-trial-ledger-replay
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-declarations-gate
    subject: CMP-declarations
    claim_type: contract
    statement: >-
      Only committed declarations reach the belief model; no evidence recorded
      against a contract that no declared test can measure moves a belief; and
      making an uncommitted edit to a declaration file changes no verdict.
    premises: [LMA-worktree-inert, AXM-no-belief-write-path, AXM-commit-is-approval, DEF-belief-eligible]
    derivation_rule: >-
      By AXM-commit-is-approval a declaration takes effect only from the
      committed revision, so only committed declarations reach the belief
      model. By DEF-belief-eligible evidence is belief-eligible only when it is
      recorded against a contract that a declared test can measure, and by
      AXM-no-belief-write-path nothing else moves a measured belief. By
      LMA-worktree-inert making an uncommitted edit to a declaration file
      changes no verdict. evidence: CTR-declarations-gate
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-consistency-declarations-gate
    subject: CMP-consistency-declarations
    claim_type: contract
    statement: >-
      Only the declarations at the head revision and the proposals staged in
      the ledger enter the premise graph, and a staged proposal takes no effect
      as a declaration. A declared or staged node that no build admits is
      reported, never dropped in silence, and so is a declared or staged branch
      whose subject belief.yaml no longer declares; that branch keeps its proof
      state.
    premises: [AXM-commit-is-approval, AXM-no-silent-failure, DEF-premise-graph, DEF-current-trial, DEF-proof-state]
    derivation_rule: >-
      By DEF-premise-graph a build admits nothing but the head revision's
      declarations and the ledger's staged proposals. By AXM-commit-is-approval
      a declaration takes effect only from the committed revision, so a proposal
      that is only staged takes no effect as one. By AXM-no-silent-failure a
      declared or staged node that cannot take its place in the premise graph,
      and a declared or staged branch whose subject belief.yaml no longer
      declares, are reported rather than dropped. By DEF-proof-state a node's
      proof state is computed from its place in the graph, the version of it the
      build admitted -- its declaration at the head revision, or, for an id not
      declared there, its staged proposal -- with that version's statement,
      cited premises and declared sufficiency, and the trials on it, its subject
      excluded; a subject is neither a premise, by DEF-premise-graph, nor part
      of a fingerprint, by DEF-current-trial, so losing it changes neither the
      branch's place in the graph nor which of its trials are current, and its
      proof state stands. evidence: CTR-consistency-declarations-gate
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-model-honest
    subject: CMP-belief-model
    claim_type: contract
    statement: >-
      A slice's posterior changes only through belief-eligible evidence, and
      never through a record whose provenance is asserted; below its declared
      sufficiency a slice issues no verdict; and trials that differ on their
      contract's declared compatibility key are never pooled into one measured
      belief.
    premises: [AXM-no-belief-write-path, LMA-asserted-is-inert, AXM-sparse-data-no-verdict, DEF-contract-slice]
    derivation_rule: >-
      By AXM-no-belief-write-path a measured belief -- the posterior over a
      contract slice -- changes only through belief-eligible evidence, and by
      LMA-asserted-is-inert never through an asserted record. By
      DEF-contract-slice a slice is a claim of its own, its verdict is on that
      slice, and its sufficiency is counted over its own trials, so by
      AXM-sparse-data-no-verdict a slice below its declared sufficiency issues
      no verdict. By DEF-contract-slice trials that differ on a key of the
      contract's declared compatibility key belong to different slices; by
      AXM-no-belief-write-path a measured belief is the posterior over one
      slice, and by DEF-contract-slice that posterior is computed from its own
      slice's trials and the contract's declared prior alone, so they are never
      pooled into one measured belief.
      evidence: CTR-model-honest
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-diagnosis-coverage-first
    subject: CMP-diagnosis
    claim_type: contract
    statement: >-
      While the component the diagnosis ranks first has no observation against
      its own contract, the diagnosis recommends no optimisation of any
      component; and a component is confirmed failing only on failing
      observations against its own contract, never on an end-to-end outcome
      alone.
    premises: [AXM-coverage-binds-first, AXM-observe-before-optimise, DEF-observation]
    derivation_rule: >-
      The first clause is AXM-coverage-binds-first, with observation as
      DEF-observation defines it. DEF-observation confirms a component as
      failing only on failing observations against its own contract, and
      AXM-observe-before-optimise adds that an end-to-end outcome alone
      attributes to no component. evidence: CTR-diagnosis-refuses-blind-optimisation
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-runner-captures
    subject: CMP-runner
    claim_type: contract
    statement: >-
      Every measured record carries the artifact the server captured and its
      hash, and a metric the artifact does not contain is excluded rather than
      synthesised.
    premises: [AXM-no-belief-write-path, DEF-belief-eligible]
    derivation_rule: >-
      By DEF-belief-eligible a measured record is one the server produced by
      running a declared test and capturing its artifact with the artifact's
      hash, its metrics taken from that artifact; so every measured record
      carries both, and a metric the artifact does not contain is not among a
      measured record's metrics. Scoring it anyway would move a measured belief
      through something that is not belief-eligible evidence, which
      AXM-no-belief-write-path forbids, so it is excluded.
      evidence: CTR-surface-intact
    sufficiency: {n_min: 3, min_consensus: 0.8}

  - id: BRN-monitor-moves-nothing
    subject: CMP-stamp-monitor
    claim_type: contract
    statement: >-
      Producing a report changes no measured belief and no proof state: a report
      is neither belief-eligible evidence nor a trial recorded on a node, and a
      finding it states -- that evidence is stale, damaged or one-sided -- is
      not a record, so it moves no belief.
    premises: [AXM-no-belief-write-path, DEF-belief-eligible, DEF-proof-state, DEF-premise-graph, DEF-current-trial, DEF-ledger, DEF-report]
    derivation_rule: >-
      Beliefs: by DEF-report, producing a report appends no record to the ledger
      of any provenance and changes no declaration. Belief-eligible evidence, by
      DEF-belief-eligible, is a trial record, measured or imported -- a record
      in the ledger as DEF-ledger names it. Producing a report appends none, and
      a finding it states is part of its output, not a record; so by
      AXM-no-belief-write-path, under which a measured belief changes only
      through belief-eligible evidence, no measured belief moves. Proof states:
      by DEF-proof-state a node's proof state is computed from its place in the
      premise graph, the version of it the build admitted -- its declaration at
      the head revision, or, for an id not declared there, its staged proposal
      -- and the trials recorded on it; a report changes no declaration and,
      appending no record, stages or restates no proposal, so neither which
      version a build admits nor that version changes. By DEF-premise-graph the
      graph is built from the axioms, definitions, lemmas and branches declared
      at the head revision and the proposals staged in the ledger; a report
      changes no declaration and appends no record, so it stages no proposal and
      the graph is unchanged, whatever else it reads or writes. By
      DEF-current-trial whether a trial is current depends on its validity after
      amendments, its target being in the premise graph, and the fingerprints it
      recorded; a report appends no trial and no amendment and leaves the graph
      unchanged, so the trials recorded on each node, and which of them are
      current, are unchanged. So no proof state changes. evidence:
      CTR-monitor-read-only
    sufficiency: {n_min: 3, min_consensus: 0.8}

policies:
  - id: POL-consistency-gate
    criteria:
      - {target: BRN-dag-integrity, require: proven, evidence: supported}
      - {target: BRN-falsification-trial-ledger, require: proven, evidence: supported}
      - {target: BRN-declarations-gate, require: proven, evidence: supported}
      - {target: BRN-consistency-declarations-gate, require: proven, evidence: supported}
      - {target: BRN-model-honest, require: proven, evidence: supported}
      - {target: BRN-diagnosis-coverage-first, require: proven, evidence: supported}
      - {target: BRN-runner-captures, require: proven, evidence: supported}
      - {target: BRN-monitor-moves-nothing, require: proven, evidence: supported}
