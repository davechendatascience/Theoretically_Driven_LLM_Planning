<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a drawing's title block across the top; below it an index of components and claims,
   the selected node's lineage drawn left to right as "rests on", and an inspector that reads
   the node in full, proof tree included. */
:root {
  --paper: #f3f5f7;
  --sheet: #ffffff;
  --ink: #15181c;
  --ink-2: #545c66;
  --ink-3: #8a929c;
  --rule: #dde2e7;
  --rule-strong: #b9c1ca;
  --edge: #a9b2bc;
  --accent: #3446c9;
  --accent-tint: #e9ecfb;
  --ok: #1f8a4c;
  --open: #b7791f;
  --stale: #5a7591;
  --bad: #c8323c;
  --warn-bg: #fdf4e3;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-id: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-prose: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1114; --sheet: #161a1f; --ink: #e5e8ec; --ink-2: #a3acb7; --ink-3: #6f7883;
    --rule: #262c33; --rule-strong: #3a424c; --edge: #4d5661; --accent: #8e9bff; --accent-tint: #1f2440;
    --ok: #4cc07a; --open: #e3a33b; --stale: #8fa8c4; --bad: #f06a72; --warn-bg: #2b2414;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1114; --sheet: #161a1f; --ink: #e5e8ec; --ink-2: #a3acb7; --ink-3: #6f7883;
  --rule: #262c33; --rule-strong: #3a424c; --edge: #4d5661; --accent: #8e9bff; --accent-tint: #1f2440;
  --ok: #4cc07a; --open: #e3a33b; --stale: #8fa8c4; --bad: #f06a72; --warn-bg: #2b2414;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--font-ui); margin: 0; }
.page { padding: 20px 16px 40px; max-width: 1880px; margin: 0 auto; display: grid; gap: 14px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- title block ---------- */
.titleblock { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); border: 1px solid var(--rule-strong); background: var(--sheet); }
.titleblock > div { padding: 10px 14px; border-left: 1px solid var(--rule); min-width: 0; }
.titleblock > div:first-child { border-left: 0; }
.tb-label { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.tb-name { font: 600 22px/1.2 var(--font-ui); text-wrap: balance; overflow-wrap: anywhere; }
.tb-val { font: 13px/1.5 var(--font-id); overflow-wrap: anywhere; }
.tb-sub { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.tb-note { grid-column: 1 / -1; border-left: 0 !important; border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 13px; }
.pending { background: var(--warn-bg); border: 1px solid var(--open); padding: 8px 14px; font-size: 13px; }

/* ---------- summary ---------- */
.summary { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-end; }
.sum { display: grid; gap: 4px; min-width: 150px; }
.sum-head { display: flex; gap: 8px; align-items: baseline; }
.sum-head b { font: 600 13px var(--font-ui); }
.sum-head span { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 8px; width: 220px; max-width: 100%; background: var(--rule); border-radius: 2px; overflow: hidden; gap: 1px; }
.bar i { display: block; height: 100%; }
.sum-keys { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sum-keys span { display: inline-flex; align-items: center; gap: 5px; }
.sum-counts { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sum-issues { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 4px; padding: 4px 10px; cursor: pointer; text-align: left; display: grid; gap: 1px; }
.sum-issues:hover { border-color: var(--accent); }
.sum-issues b { font: 600 13px var(--font-ui); }
.sum-issues span { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ---------- marks: state in form as well as color ---------- */
.mark { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; }
.m-ok { background: var(--ok); }
.m-open { border: 1.5px solid var(--open); }
.m-doubt { border: 1.5px solid var(--open); background: linear-gradient(90deg, var(--open) 50%, transparent 50%); }
.m-stale { border: 1.5px dashed var(--stale); }
.m-bad { background: var(--bad); border-radius: 1px; width: 8px; height: 8px; transform: rotate(45deg); }
.m-none { border: 1.5px solid var(--rule-strong); }
.m-decl { background: var(--ink-3); border-radius: 1px; width: 7px; height: 7px; }
.c-ok { background: var(--ok); } .c-open { background: var(--open); } .c-doubt { background: var(--open); opacity: .6; }
.c-stale { background: var(--stale); } .c-bad { background: var(--bad); } .c-none { background: var(--rule-strong); }

/* ---------- workspace ---------- */
.work { display: grid; grid-template-columns: minmax(250px, 300px) minmax(0, 1fr) minmax(320px, 440px); gap: 14px; align-items: start; }
.panel { background: var(--sheet); border: 1px solid var(--rule); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.panel-head h2 { font: 600 13px var(--font-ui); margin: 0; letter-spacing: .02em; }

/* index */
.index { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--rule); }
.tab { border: 0; background: none; padding: 6px 8px 7px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; font-size: 13px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.search { margin: 8px 8px 4px; }
.search input { width: 100%; padding: 6px 8px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--paper); color: var(--ink); font: 13px var(--font-id); }
.filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 8px 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 1px 8px; font-size: 12px; cursor: pointer; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: var(--accent-tint); }
.list { overflow-y: auto; flex: 1; min-height: 120px; border-top: 1px solid var(--rule); }
.group-h { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 10px 10px 4px; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 2px 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 5px 10px; cursor: pointer; border-left: 2px solid transparent; }
.row:hover { background: var(--paper); }
.row[aria-current="true"] { background: var(--accent-tint); border-left-color: var(--accent); }
.row .rid { font: 12.5px var(--font-id); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rsub { grid-column: 2; color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.issue .rsub { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row.static { cursor: default; }
.row.static:hover { background: none; }
.code { font: 11.5px var(--font-id); color: var(--ink-2); }
.issue-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.issue-list li { display: grid; gap: 1px; }
.strip { grid-column: 2; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.strip .mark { width: 7px; height: 7px; }
.strip .more { font-size: 11px; color: var(--ink-3); margin-left: 3px; }

/* lineage graph */
.graph-panel { min-width: 0; }
.graph-tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 4px; padding: 3px 9px; font-size: 12.5px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; border-color: var(--rule); }
.btn[aria-pressed="true"] { background: var(--accent-tint); border-color: var(--accent); }
.graph-scroll { overflow: auto; max-height: calc(100vh - 60px); }
.graph-sizer { position: relative; }
.graph { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.graph svg { position: absolute; left: 0; top: 0; overflow: visible; }
.colh { position: absolute; top: 8px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.node { position: absolute; display: flex; gap: 6px; align-items: center; height: 36px; padding: 3px 8px; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 5px; cursor: pointer; text-align: left; overflow: hidden; }
.node:hover { border-color: var(--accent); }
.node.sel { border: 2px solid var(--accent); background: var(--accent-tint); padding: 2px 7px; }
.node.staged { border-style: dotted; border-width: 1.5px; }
.node .lbl { font: 11.5px/1.25 var(--font-ui); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.node .pfx { color: var(--ink-3); }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.2; }
.edge.hot { stroke: var(--accent); stroke-width: 2; }
.arrowhead { fill: var(--edge); }
.graph-note { padding: 8px 10px; color: var(--ink-3); font-size: 12px; border-top: 1px solid var(--rule); }

/* inspector */
.inspector { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; padding: 14px 16px 20px; }
.eyebrow { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.insp-id { font: 500 15px/1.35 var(--font-id); margin: 2px 0 6px; overflow-wrap: anywhere; }
.statebadge { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
.why { color: var(--ink-2); font-size: 13px; margin: 4px 0 0; overflow-wrap: anywhere; }
.insp section { margin-top: 16px; }
.insp h3 { font: 600 11px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; }
.prose { font: 15px/1.55 var(--font-prose); margin: 0; overflow-wrap: anywhere; max-width: 65ch; }
.prose.muted { color: var(--ink-2); font-size: 14px; }
.ref { border: 0; background: none; padding: 0; font: inherit; font-family: var(--font-id); font-size: .86em; color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 2px; overflow-wrap: anywhere; text-align: left; }
.ref:hover { text-decoration-color: var(--accent); }
.plain-id { font: 12.5px var(--font-id); color: var(--ink-2); overflow-wrap: anywhere; }
.refs { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.refs .item { display: inline-flex; gap: 6px; align-items: center; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.code-list { margin: 0; padding: 0; list-style: none; font: 12px/1.6 var(--font-id); color: var(--ink-2); }
.code-list li { overflow-wrap: anywhere; }
.reach { display: grid; gap: 8px; }
.reach-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.reach-row > span:first-child { color: var(--ink-3); }

/* proof tree */
.tree { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 1px solid var(--rule); }
.tree.root { padding-left: 0; border-left: 0; }
.tree li { margin: 2px 0; }
.tree summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 12px 12px minmax(0, 1fr); gap: 6px; align-items: start; padding: 3px 4px; border-radius: 4px; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary:hover { background: var(--paper); }
.tree summary .tw { color: var(--ink-3); font-size: 10px; line-height: 18px; transition: transform .12s; }
.tree details[open] > summary .tw { transform: rotate(90deg); }
.tree summary .mark { margin-top: 5px; }
.tree .sline { min-width: 0; }
.tree .hd { display: block; color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .body { padding: 2px 0 6px 30px; display: grid; gap: 6px; }
.tree .body .prose { font-size: 14px; }
.tree .kindtag { color: var(--ink-3); font-size: 11.5px; margin-left: 6px; }
.empty { color: var(--ink-3); font-size: 13px; padding: 14px 10px; }

@media (max-width: 1200px) {
  .work { grid-template-columns: minmax(230px, 280px) minmax(0, 1fr); }
  .inspector { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 760px) {
  .titleblock { grid-template-columns: minmax(0, 1fr); }
  .titleblock > div { border-left: 0; border-top: 1px solid var(--rule); }
  .titleblock > div:first-child { border-top: 0; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .index { position: static; max-height: 360px; }
  .graph-scroll { max-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="page">
  <header class="titleblock" id="titleblock"></header>
  <div class="pending" id="pending" hidden></div>
  <section class="summary" id="summary" aria-label="State of the design graph"></section>
  <div class="work">
    <nav class="panel index" aria-label="Index">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-components" data-tab="components">Components</button>
        <button class="tab" role="tab" id="tab-claims" data-tab="claims">Claims</button>
        <button class="tab" role="tab" id="tab-foundations" data-tab="foundations">Foundations</button>
        <button class="tab" role="tab" id="tab-issues" data-tab="issues">Issues</button>
      </div>
      <div class="search"><input id="search" type="search" placeholder="Find an id" aria-label="Find an id" autocomplete="off"></div>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
    </nav>
    <section class="panel graph-panel" aria-labelledby="graph-title">
      <div class="panel-head">
        <h2 id="graph-title">Lineage</h2>
        <div class="graph-tools">
          <button class="btn" id="back" disabled>Back</button>
          <button class="btn" id="fit" aria-pressed="false">Fit width</button>
        </div>
      </div>
      <div class="graph-scroll" id="graph-scroll"><div class="graph-sizer" id="graph-sizer"><div class="graph" id="graph"></div></div></div>
      <div class="graph-note">Arrows read "rests on": a component rests on the branches that govern it, a claim on its premises, an axiom on the goal whose requirement it states. Click a node to walk to it.</div>
    </section>
    <aside class="panel inspector" id="inspector" aria-label="Selected node"></aside>
  </div>
</div>

<script type="application/json" id="snapshot">__SNAPSHOT__</script>
<script>
(function () {
  "use strict";
  const S = JSON.parse(document.getElementById("snapshot").textContent);
  const N = S.nodes;
  const out = {}, inc = {};
  for (const id in N) { out[id] = []; inc[id] = []; }
  for (const [a, b] of S.edges) { out[a].push(b); inc[b].push(a); }

  const KIND = {
    goal: { word: "Goal", file: "goals.yaml" }, axiom: { word: "Axiom", file: "consistency.yaml" },
    definition: { word: "Definition", file: "consistency.yaml" }, lemma: { word: "Lemma", file: "consistency.yaml" },
    branch: { word: "Branch", file: "consistency.yaml" }, component: { word: "Component", file: "belief.yaml" },
    interface: { word: "Interface", file: "belief.yaml" },
  };
  const STATE = {
    refuted: ["bad", "Refuted"], ungrounded: ["bad", "Ungrounded"], doubted: ["doubt", "Doubted"],
    stale: ["stale", "Stale"], obligation: ["open", "Open obligation"], proven: ["ok", "Proven"],
    "undeclared design": ["open", "Undeclared design"], planned: ["open", "Planned"],
    governed: ["ok", "Governed"], "no design claim": ["none", "No design claim"], "declared only": ["none", "Declared only"],
  };
  const CLAIM_ORDER = ["refuted", "ungrounded", "doubted", "stale", "obligation", "proven"];
  const COVER_ORDER = ["undeclared design", "planned", "governed", "declared only", "no design claim"];
  const COVER_WORDS = {
    governed: "Code exists, and a declared branch says why.",
    "undeclared design": "Code exists, and no declared branch says why: declare the design or prune the code.",
    planned: "A design is declared ahead of the code.",
    "declared only": "Declared in belief.yaml with no code and no design.",
    "no design claim": "No design claim governs this interface.",
  };
  const stateOf = (n) => n.state || n.coverage || null;
  const cls = (n) => { const s = stateOf(n); return s && STATE[s] ? STATE[s][0] : "decl"; };
  const word = (n) => { const s = stateOf(n); return s && STATE[s] ? STATE[s][1] : ""; };
  const isClaim = (n) => n.kind === "branch" || n.kind === "lemma";
  const isSubject = (n) => n.kind === "component" || n.kind === "interface";

  const el = (tag, attrs, ...kids) => {
    const e = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k);
    return e;
  };
  const mark = (n) => el("span", { class: "mark m-" + cls(n), "aria-hidden": "true" });
  const headline = (t, len) => { t = (t || "").replace(/\s+/g, " ").trim(); return t.length > len ? t.slice(0, len - 1) + "…" : t; };

  // ---------- closure ----------
  function closure(id, adj) {
    const seen = new Set(), stack = [...adj[id]];
    while (stack.length) { const x = stack.pop(); if (!seen.has(x)) { seen.add(x); stack.push(...adj[x]); } }
    return seen;
  }
  const upCache = {}, downCache = {};
  const up = (id) => upCache[id] || (upCache[id] = closure(id, out));
  const down = (id) => downCache[id] || (downCache[id] = closure(id, inc));

  // ---------- title block ----------
  function titleBlock() {
    const tb = document.getElementById("titleblock");
    const pretty = S.project.replace(/[_-]+/g, " ");
    const src = Object.entries(S.sources).map(([f, committed]) => el("div", { class: "tb-val" }, committed ? f : `${f} · not committed`));
    tb.append(
      el("div", {}, el("div", { class: "tb-label", text: "Graph snapshot" }), el("div", { class: "tb-name", text: pretty })),
      el("div", {}, el("div", { class: "tb-label", text: "Revision" }), el("div", { class: "tb-val", text: S.revision + " · " + S.committed }),
        el("div", { class: "tb-sub", text: S.subject })),
      el("div", {}, el("div", { class: "tb-label", text: `Declarations read at ${S.revision}` }), ...src),
      el("div", {}, el("div", { class: "tb-label", text: "Taken" }), el("div", { class: "tb-val", text: S.taken })),
      el("div", { class: "tb-note" }, "The declarations committed at this revision, joined across the three files, with each lemma's and branch's proof state and the gaps between them. It reads no evidence, so contracts appear by name only. It does not update: take a new snapshot to see later commits."),
    );
    if (S.pending.length) {
      const p = document.getElementById("pending");
      p.hidden = false;
      p.textContent = `${S.pending.join(" and ")} ${S.pending.length > 1 ? "have" : "has"} uncommitted edits. This snapshot shows the committed version.`;
    }
  }

  // ---------- summary ----------
  function summary() {
    const box = document.getElementById("summary");
    const groups = [
      ["Branches", (n) => n.kind === "branch", CLAIM_ORDER],
      ["Lemmas", (n) => n.kind === "lemma", CLAIM_ORDER],
      ["Components", (n) => n.kind === "component", COVER_ORDER],
      ["Interfaces", (n) => n.kind === "interface", COVER_ORDER],
    ];
    for (const [title, pred, order] of groups) {
      const items = Object.values(N).filter(pred);
      if (!items.length) continue;
      const counts = {};
      for (const n of items) { const s = stateOf(n) || "?"; counts[s] = (counts[s] || 0) + 1; }
      const keys = order.filter((s) => counts[s]);
      const bar = el("div", { class: "bar", role: "img", "aria-label": keys.map((s) => `${counts[s]} ${STATE[s][1].toLowerCase()}`).join(", ") },
        keys.map((s) => el("i", { class: "c-" + STATE[s][0], style: `flex:${counts[s]}` })));
      box.append(el("div", { class: "sum" },
        el("div", { class: "sum-head" }, el("b", { text: title }), el("span", { text: String(items.length) })),
        bar,
        el("div", { class: "sum-keys" }, keys.map((s) => el("span", {}, el("span", { class: "mark m-" + STATE[s][0] }), `${counts[s]} ${STATE[s][1].toLowerCase()}`)))));
    }
    const count = (k) => Object.values(N).filter((n) => n.kind === k).length;

      if (n.code && n.code.length) parts.push(section(`Code · ${n.code.length} path${n.code.length === 1 ? "" : "s"}`, el("ul", { class: "code-list" }, n.code.map((c) => el("li", { text: c })))));
    } else if (n.kind === "axiom") {
      parts.push(section("Statement", prose(n.text)));
      if (n.rationale) parts.push(section("Rationale", prose(n.rationale, true)));
      parts.push(el("dl", { class: "kv" }, el("dt", { text: "Domain" }), el("dd", { text: n.domain || "—" })));
      if (n.goals && n.goals.length) parts.push(section("States a requirement of", refs(n.goals)));
      parts.push(section("What rests on it", groupedReach(down(n.id))));
      if (regionsSection(n)) parts.push(regionsSection(n));
    } else if (n.kind === "definition") {
      parts.push(section(n.term || "Meaning", prose(n.text)));
      parts.push(section("What rests on it", groupedReach(down(n.id))));
      if (regionsSection(n)) parts.push(regionsSection(n));
    } else if (n.kind === "goal") {
      parts.push(section("Outcome", prose(n.text)));
      if (n.measure) parts.push(section("Measured by", plainIds([n.measure])));
      parts.push(section("Requirements stated as axioms", inc[n.id].length ? refs(inc[n.id].sort())
        : el("div", { class: "empty", text: "No axiom names this goal, so no theory traces to it." })));
      const served = Object.values(N).filter((c) => c.kind === "component" && c.goal === n.id).map((c) => c.id);
      parts.push(section("Components that name it", served.length ? refs(served) : el("div", { class: "empty", text: "No component names this goal." })));
    }
    box.replaceChildren(el("div", { class: "insp" }, kids, parts));
    box.scrollTop = 0;
  }

  // ---------- selection ----------
  let current = null;
  const history = [];
  function select(id, fromBack) {
    if (!N[id] || id === current) return;
    if (current && !fromBack) history.push(current);
    current = id;
    document.getElementById("back").disabled = !history.length;
    try { window.history.replaceState(null, "", "#" + id); } catch (e) { /* the frame may refuse it */ }
    for (const r of document.querySelectorAll(".row")) r.setAttribute("aria-current", r.dataset.id === id ? "true" : "false");
    renderGraph();
    renderInspector();
  }
  document.getElementById("back").addEventListener("click", () => { if (history.length) select(history.pop(), true); });
  document.getElementById("fit").addEventListener("click", (e) => { fit = !fit; e.currentTarget.setAttribute("aria-pressed", String(fit)); renderGraph(); });
  for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => { tab = t.dataset.tab; filter = null; renderIndex(); });
  document.getElementById("search").addEventListener("input", renderIndex);

  titleBlock();
  summary();
  // A link names a node (#BRN-x) or a tab (#issues); either beats the focus the page was taken with.
  const fromHash = decodeURIComponent((location.hash || "").slice(1));
  const subjects = Object.values(N).filter(isSubject);
  const first = (N[fromHash] && fromHash) || (S.focus && N[S.focus] && S.focus)
    || (subjects.find((n) => n.coverage === "governed") || subjects[0] || Object.values(N).find(isClaim) || Object.values(N)[0]).id;
  if (["components", "claims", "foundations", "issues"].includes(fromHash)) tab = fromHash;
  else if (isClaim(N[first])) tab = "claims";
  else if (!isSubject(N[first])) tab = "foundations";
  renderIndex();
  select(first);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure = null; renderGraph(); });
})();
</script>
